<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go 快速入门教程 - 学练一体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1419;--surface:#1a2332;--border:#2d3b4f;--text:#e6edf3;--text-dim:#8b949e;--primary:#58a6ff;--primary-hover:#79c0ff;--success:#3fb950;--success-bg:rgba(63,185,80,.12);--error:#f85149;--error-bg:rgba(248,81,73,.12);--warning:#d29922;--sidebar-w:280px;--header-h:56px;--fs-base:15px;--fs-mono:13px;--fs-title:26px;--fs-desc:15px;--fs-code:13px;--fs-small:12px;--fs-sidebar:14px;--fs-tab:13px}
body.light{--bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--text:#1f2328;--text-dim:#656d76;--primary:#0969da;--primary-hover:#0550ae;--success:#1a7f37;--success-bg:rgba(26,127,55,.12);--error:#cf222e;--error-bg:rgba(207,34,46,.12);--warning:#9a6700}
body.light #sidebar .section:hover{background:rgba(0,0,0,.03)}
body.light #section-desc pre{background:#f6f8fa}
body.light .exercise-hint{background:rgba(154,103,0,.08);border-color:rgba(154,103,0,.2)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji";background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
a{color:var(--primary);text-decoration:none}
header{height:var(--header-h);display:flex;align-items:center;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100}
header h1{font-size:18px;font-weight:600;flex:1}
header .version{font-size:12px;color:var(--text-dim);background:var(--border);padding:2px 10px;border-radius:4px;flex-shrink:0}
#menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;margin-right:8px}
#theme-toggle{background:none;border:none;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:4px;margin-right:8px;transition:background .15s;line-height:1;flex-shrink:0}
#theme-toggle:hover{background:rgba(255,255,255,.08)}
body.light #theme-toggle:hover{background:rgba(0,0,0,.06)}
#theme-toggle::before{content:'\2601'}
body.light #theme-toggle::before{content:'\2600'}
#font-controls{display:flex;gap:2px;margin-right:12px;align-items:center;flex-shrink:0}
#font-controls .font-btn{background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;padding:2px 7px;border-radius:3px;font-size:12px;transition:all .15s;line-height:1.4;font-family:inherit}
#font-controls .font-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
body.light #font-controls .font-btn:hover{background:rgba(0,0,0,.06)}
#font-controls .font-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
#font-controls .font-btn[data-size="small"]{font-size:10px}
#font-controls .font-btn[data-size="medium"]{font-size:12px}
#font-controls .font-btn[data-size="large"]{font-size:14px}
#app{display:flex;height:calc(100vh - var(--header-h));margin-top:var(--header-h)}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
#sidebar .section{display:block;padding:10px 20px;cursor:pointer;font-size:var(--fs-sidebar);color:var(--text-dim);border-left:3px solid transparent;transition:all .15s;text-decoration:none}
#sidebar .section:hover{color:var(--text);background:rgba(255,255,255,.04)}
#sidebar .section.active{color:var(--primary);border-left-color:var(--primary);background:rgba(88,166,255,.08)}
#sidebar .section .num{display:inline-block;width:20px;font-size:12px;color:var(--text-dim);margin-right:6px}
#sidebar .section.active .num{color:var(--primary)}
#sidebar .divider{height:1px;background:var(--border);margin:8px 12px}
#sidebar .section .done{float:right;font-size:11px;color:var(--success)}
#content{flex:1;min-width:0;overflow-y:auto;padding:28px 36px}
#section-title{font-size:var(--fs-title);font-weight:700;margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid var(--primary);display:inline-block}
#section-progress{font-size:var(--fs-small);color:var(--text-dim);margin-bottom:16px}
.section-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
.section-tab{padding:8px 18px;cursor:pointer;font-size:var(--fs-tab);color:var(--text-dim);border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;transition:all .15s;background:transparent;white-space:nowrap}
.section-tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.section-tab.active{color:var(--primary);background:var(--surface);border-color:var(--border);position:relative}
.section-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--surface)}
.section-tab .check{display:none;margin-left:5px;font-size:11px}
.section-tab.done .check{display:inline;color:var(--success)}
#section-desc{font-size:var(--fs-desc);line-height:1.8;color:var(--text-dim);margin-bottom:20px;max-width:860px}
#section-desc h4{color:var(--text);font-size:16px;margin:18px 0 8px}
#section-desc p{margin:8px 0}
#section-desc code{background:var(--border);padding:2px 6px;border-radius:3px;font-size:13px;color:var(--primary)}
#section-desc strong{color:var(--text)}
#section-desc ul{margin:8px 0;padding-left:22px}
#section-desc li{margin:5px 0}
#section-desc pre{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin:10px 0;overflow-x:auto;font-size:13px;line-height:1.5;font-family:"SF Mono","Fira Code",monospace}
#section-desc pre code{background:none;padding:0;color:var(--text);font-size:inherit}
#exercise-area{display:none;margin-bottom:16px}
#exercise-area.show{display:block}
#exercise-title{font-size:16px;font-weight:600;color:var(--primary);margin-bottom:8px}
#exercise-desc{font-size:var(--fs-desc);line-height:1.7;color:var(--text-dim);margin-bottom:10px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
#exercise-desc code{background:var(--border);padding:1px 5px;border-radius:3px;font-size:13px;color:var(--primary)}
#exercise-hint{display:none;font-size:13px;color:var(--warning);margin-bottom:10px;padding:10px 14px;background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.25);border-radius:6px}
#exercise-hint.show{display:block}
#exercise-hint code{background:rgba(210,153,34,.15);padding:1px 5px;border-radius:3px}
.toggle-hint{background:none;border:none;color:var(--warning);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.toggle-hint:hover{color:var(--primary-hover)}
#editor-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
#editor-container{height:380px}
#editor-container.loading{display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px}
#controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#controls button{display:flex;align-items:center;gap:5px;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:var(--fs-small);font-weight:500;transition:all .15s}
#controls button:disabled{opacity:.4;cursor:not-allowed}
#run-btn{background:var(--success);color:#fff}
#run-btn:hover:not(:disabled){filter:brightness(1.15)}
#run-btn.running{opacity:.7;pointer-events:none}
#reset-btn{background:var(--border);color:var(--text)}
#reset-btn:hover:not(:disabled){background:var(--text-dim);color:var(--bg)}
#submit-btn{background:var(--primary);color:#fff;display:none}
#submit-btn:hover:not(:disabled){background:var(--primary-hover)}
#submit-btn.show{display:flex}
#hint-btn{background:transparent;color:var(--warning);border:1px solid var(--warning)!important;display:none}
#hint-btn.show{display:flex}
#hint-btn:hover{background:rgba(210,153,34,.1)}
#back-btn{background:var(--border);color:var(--text-dim);display:none;font-size:12px}
#back-btn.show{display:flex}
#back-btn:hover{color:var(--text)}
#controls button svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
#output{display:none;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
#output.show{display:block}
#output-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:var(--fs-small);color:var(--text-dim)}
#output-header .badge{font-size:11px;padding:2px 8px;border-radius:3px}
#output-header .badge.success{background:var(--success-bg);color:var(--success)}
#output-header .badge.error{background:var(--error-bg);color:var(--error)}
#output-content{padding:16px;font-family:"SF Mono","Fira Code","Cascadia Code",monospace;font-size:var(--fs-mono);line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:50px;max-height:350px;overflow-y:auto;background:var(--bg);color:var(--text);margin:0}
#output-content .out-log{color:var(--text)}
#output-content .out-err{color:var(--error)}
#output-content .out-info{color:var(--text-dim);font-style:italic}
.result-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;margin:4px 0;border-radius:4px;font-size:var(--fs-mono);line-height:1.5}
.result-item.pass{background:var(--success-bg)}
.result-item.fail{background:var(--error-bg)}
.result-item .icon{font-size:16px;flex-shrink:0;margin-top:1px}
.result-item .icon.pass{color:var(--success)}
.result-item .icon.fail{color:var(--error)}
.result-item .detail{flex:1}
.result-item .detail .args{color:var(--text-dim);font-size:12px}
.result-item .detail .got{color:var(--error);font-size:12px}
.result-item .detail .expected{color:var(--success);font-size:12px}
.result-summary{font-size:15px;font-weight:600;padding:10px 0 4px}
.result-summary.all-pass{color:var(--success)}
.result-summary.has-fail{color:var(--error)}
#sidebar::-webkit-scrollbar,#content::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-track,#content::-webkit-scrollbar-track{background:transparent}
#sidebar::-webkit-scrollbar-thumb,#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#loading-overlay.hide{opacity:0;pointer-events:none}
#loading-overlay .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-overlay .text{color:var(--text-dim);font-size:14px}
@media(max-width:820px){
  #sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .25s;width:260px;min-width:260px}
  #sidebar.open{transform:translateX(0)}
  #menu-toggle{display:block}
  #content{padding:20px 14px}
  #editor-container{height:260px}
  #section-title{font-size:calc(var(--fs-title) - 4px)}
  #section-desc{font-size:calc(var(--fs-desc) - 1px)}
  #controls button{padding:7px 12px}
  .section-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:0}
  .section-tab{padding:7px 12px}
  #font-controls{display:none}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script src="wasm/wasm_exec.js"></script>
<script src="wasm/gorunner.js"></script>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="text">正在加载 Go 教程 ...</div>
</div>

<header>
  <button id="menu-toggle" aria-label="菜单">&#9776;</button>
  <button id="theme-toggle" aria-label="切换主题" title="切换暗色/淡色主题"></button>
  <h1>Go 快速入门教程</h1>
  <div id="font-controls">
    <button class="font-btn" data-size="small" title="小字号">A</button>
    <button class="font-btn active" data-size="medium" title="中字号（默认）">A</button>
    <button class="font-btn" data-size="large" title="大字号">A</button>
  </div>
  <span class="version">v1.21</span>
</header>

<div id="app">
  <nav id="sidebar"></nav>

  <main id="content">
    <h2 id="section-title"></h2>
    <div id="section-progress"></div>

    <div class="section-tabs" id="section-tabs"></div>

    <div id="section-desc"></div>

    <div id="exercise-area">
      <div id="exercise-title"></div>
      <div id="exercise-desc"></div>
      <div id="exercise-hint"></div>
    </div>

    <div id="editor-wrap">
      <div id="editor-container" class="loading">加载编辑器中...</div>
    </div>

    <div id="controls">
      <button id="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        返回学习
      </button>
      <button id="run-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        运行代码
      </button>
      <button id="submit-btn">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        提交答案
      </button>
      <button id="hint-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        查看提示
      </button>
      <button id="reset-btn">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        重置代码
      </button>
    </div>

    <div id="output">
      <div id="output-header">
        <span>输出结果</span>
        <span id="output-status"></span>
      </div>
      <pre id="output-content"></pre>
    </div>
  </main>
</div>

<script>
// ==================== 教程章节数据 ====================
const SECTIONS = [
  {
    "id": "intro",
    "icon": "🔷",
    "title": "Go 简介 — 快速了解 Go",
    "desc": "<p>Go（Golang）是 Google 于 2009 年发布的开源编程语言，由传奇程序员 Ken Thompson（Unix 之父）、Rob Pike 和 Robert Griesemer 共同设计。</p>\n<h4>Go 的设计目标</h4>\n<ul><li><strong>编译快</strong> — 秒级编译大型项目</li><li><strong>运行快</strong> — 编译到原生机器码，无虚拟机开销</li><li><strong>开发快</strong> — 简洁的语法，无需学习复杂的 OOP 概念</li></ul>\n<svg viewBox=\"0 0 620 180\" style=\"width:100%;max-width:620px;margin:12px 0;border-radius:6px;background:#1a2332;padding:10px\"><style>.t{fill:#e6edf3;font-size:12px;font-family:monospace}.tb{fill:#58a6ff;font-weight:bold;font-size:13px}.tl{stroke:#2d3b4f;stroke-width:1}.th{fill:#3fb950}.tr{fill:#f85149}.ty{fill:#d29922}</style>\n<text x=\"20\" y=\"22\" class=\"tb\">为什么选择 Go？对比其他语言</text><line x1=\"20\" y1=\"30\" x2=\"600\" y2=\"30\" class=\"tl\"/>\n<rect x=\"20\" y=\"40\" width=\"180\" height=\"24\" rx=\"4\" fill=\"#58a6ff\" opacity=\"0.15\" stroke=\"#58a6ff\" stroke-width=\"1\"/><text x=\"110\" y=\"57\" class=\"t\" fill=\"#58a6ff\" text-anchor=\"middle\">编译速度</text>\n<text x=\"30\" y=\"77\" class=\"t\">Go: 秒级</text><text x=\"180\" y=\"77\" class=\"t\" fill=\"#8b949e\">C++: 分钟级  Java: 分钟级</text>\n<rect x=\"20\" y=\"90\" width=\"180\" height=\"24\" rx=\"4\" fill=\"#3fb950\" opacity=\"0.15\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"110\" y=\"107\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">并发模型</text>\n<text x=\"30\" y=\"127\" class=\"t\">Go: goroutine(4KB)</text><text x=\"180\" y=\"127\" class=\"t\" fill=\"#8b949e\">Java: 线程(2MB)  Python: GIL</text>\n<rect x=\"20\" y=\"140\" width=\"180\" height=\"24\" rx=\"4\" fill=\"#d29922\" opacity=\"0.15\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"110\" y=\"157\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">语法复杂度</text>\n<text x=\"30\" y=\"177\" class=\"t\">Go: 25 关键字</text><text x=\"180\" y=\"177\" class=\"t\" fill=\"#8b949e\">C++: 84 关键字  Java: 50+</text></svg>\n<h4>第一个 Go 程序</h4>\n<pre><code>package main    // 包声明：可执行程序 = package main\n\nimport \"fmt\"   // 导入标准库 fmt\n\nfunc main() {  // 程序入口\n    fmt.Println(\"Hello, World!\")\n}</code></pre>\n<h4>Go 工作区结构</h4><p>从 Go 1.16 起推荐使用 Module：</p>\n<pre><code>myproject/\n├── go.mod          # 模块定义\n├── main.go         # 入口\n├── handler/        # 子包\n│   └── user.go\n└── go.sum          # 依赖校验</code></pre>",
    "code": "package main\nimport \"fmt\"\nfunc main() {\n    fmt.Println(\"Hello, World!\")\n    name := \"Go\"\n    fmt.Printf(\"你好, %s!\\n\", name)\n}",
    "exercises": [
      {
        "id": "go-i1",
        "title": "编写 greet 函数",
        "desc": "编写 greet(name string) string，返回 \"Hello, \" + name。",
        "hint": "func greet(n string) string { return \"Hello, \"+n }",
        "starterCode": "func greet(name string) string {\n    return \"Hello, \" + name\n}",
        "solution": "func greet(name string) string { return \"Hello, \" + name }",
        "fn": "greet",
        "tests": [
          {
            "args": [
              "World"
            ],
            "expect": "Hello, World"
          },
          {
            "args": [
              "Go"
            ],
            "expect": "Hello, Go"
          }
        ]
      },
      {
        "id": "go-i2",
        "title": "温度转换",
        "desc": "编写 fToC(f float64) float64，华氏转摄氏。公式: C = (F-32)*5/9。",
        "hint": "return (f-32)*5/9",
        "starterCode": "func fToC(f float64) float64 { return (f-32)*5/9 }",
        "solution": "func fToC(f float64) float64 { return (f-32)*5/9 }",
        "fn": "fToC",
        "tests": [
          {
            "args": [
              32
            ],
            "expect": 0
          },
          {
            "args": [
              212
            ],
            "expect": 100
          }
        ]
      }
    ]
  },
  {
    "id": "basic",
    "icon": "🔤",
    "title": "基础类型与变量",

   // 3. 短声明（最常用）\nconst Pi = 3.14159        // 4. 常量（不可修改）\n\n// 多变量\nvar a, b int = 1, 2\nwidth, height := 10, 5</code></pre>\n<h4>类型转换</h4><p>Go 没有隐式类型转换！必须显式转换：</p>\n<pre><code>var n int = 42\nvar f float64 = float64(n)  // 显式转换\nvar u uint = uint(f)        // 可能丢失精度</code></pre>",

    "desc": "<h4>if-else</h4><p>Go 的 if 没有圆括号，但必须有大括号。这防止了 C 中常见的悬吊 else 问题。</p>\n<pre><code>if score >= 90 {\n    fmt.Println(\"优秀\")\n} else if score >= 60 {\n    fmt.Println(\"及格\")\n} else {\n    fmt.Println(\"不及格\")\n}\n\n// if 中可以声明临时变量，作用域仅限于 if-else 块\nif x := compute(); x > 0 {\n    fmt.Println(\"正数:\", x)\n} else {\n    fmt.Println(\"非正数:\", x)  // 这里仍然可以访问 x\n}\n// 这里 x 已失效</code></pre>\n<h4>for 循环 — Go 只有这一个循环关键字</h4>\n<svg viewBox=\"0 0 460 200\" style=\"width:100%;max-width:460px;margin:12px 0;border-radius:6px;background:#1a2332;padding:10px\"><style>.t{fill:#e6edf3;font-size:12px;font-family:monospace}.tb{fill:#58a6ff;font-weight:bold;font-size:13px}.tl{stroke:#2d3b4f;stroke-width:1}.th{fill:#3fb950}.tr{fill:#f85149}.ty{fill:#d29922}</style>\n<text x=\"20\" y=\"22\" class=\"tb\">for 循环执行流程</text><line x1=\"20\" y1=\"30\" x2=\"440\" y2=\"30\" class=\"tl\"/>\n<rect x=\"170\" y=\"40\" width=\"80\" height=\"24\" rx=\"12\" fill=\"#58a6ff\" opacity=\"0.2\" stroke=\"#58a6ff\" stroke-width=\"1\"/><text x=\"210\" y=\"57\" class=\"t\" fill=\"#58a6ff\" text-anchor=\"middle\">i := 0</text>\n<line x1=\"210\" y1=\"64\" x2=\"210\" y2=\"74\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><polygon points=\"207,72 210,78 213,72\" fill=\"#58a6ff\"/>\n<rect x=\"170\" y=\"78\" width=\"80\" height=\"24\" rx=\"12\" fill=\"#d29922\" opacity=\"0.2\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"210\" y=\"95\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">i < 5 ?</text>\n<line x1=\"250\" y1=\"90\" x2=\"300\" y2=\"50\" stroke=\"#f85149\" stroke-width=\"1\"/><polygon points=\"298,52 303,48 300,56\" fill=\"#f85149\"/><text x=\"305\" y=\"50\" class=\"t\" fill=\"#f85149\">结束</text>\n<line x1=\"210\" y1=\"102\" x2=\"210\" y2=\"112\" stroke=\"#d29922\" stroke-width=\"1.5\"/><polygon points=\"207,110 210,116 213,110\" fill=\"#d29922\"/>\n<rect x=\"160\" y=\"116\" width=\"100\" height=\"24\" rx=\"12\" fill=\"#3fb950\" opacity=\"0.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"210\" y=\"133\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">执行循环体</text>\n<line x1=\"210\" y1=\"140\" x2=\"210\" y2=\"150\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><polygon points=\"207,148 210,154 213,148\" fill=\"#3fb950\"/>\n<rect x=\"170\" y=\"154\" width=\"80\" height=\"24\" rx=\"12\" fill=\"#58a6ff\" opacity=\"0.2\" stroke=\"#58a6ff\" stroke-width=\"1\"/><text x=\"210\" y=\"171\" class=\"t\" fill=\"#58a6ff\" text-anchor=\"middle\">i++</text>\n<line x1=\"210\" y1=\"178\" x2=\"210\" y2=\"188\" stroke=\"#58a6ff\" stroke-width=\"1\" stroke-dasharray=\"4\"/><polygon points=\"207,186 210,192 213,186\" fill=\"#58a6ff\"/>\n<text x=\"190\" y=\"200\" class=\"t\" fill=\"#8b949e\" text-anchor=\"end\">回到 i < 5 ?</text></svg>\n<pre><code>// 三种形式\nfor i := 0; i < 5; i++ { fmt.Println(i) }   // 标准\n\nsum := 1\nfor sum < 100 { sum += sum }                // 类似 while\n\nfor { /* 无限循环，用 break 退出 */ }\n\n// range 遍历\nfor i, v := range []int{10,20,30} { fmt.Println(i,v) }\nfor k, v := range map[string]int{\"a\":1} { fmt.Println(k,v) }</code></pre>\n<h4>switch</h4><p>Go 的 switch 每个 case 默认 break（不会自动穿透）。</p>\n<pre><code>switch os := runtime.GOOS; os {\ncase \"darwin\":  fmt.Println(\"macOS\")\ncase \"linux\":   fmt.Println(\"Linux\")\ncase \"windows\": fmt.Println(\"Windows\")\ndefault:        fmt.Println(\"其他:\", os)\n}\n\n// 无表达式的 switch（相当于 if-else 链）\nswitch {\ncase score >= 90: grade = \"A\"\ncase score >= 80: grade = \"B\"\ndefault:          grade = \"C\"\n}</code></pre>",
    "code": "package main\nimport \"fmt\"\nfunc main() {\n    score := 85\n    if score >= 90 { fmt.Println(\"优秀\") } else if score >= 60 { fmt.Println(\"及格\") } else { fmt.Println(\"不及格\") }\n    sum := 0\n    for i := 1; i <= 100; i++ { sum += i }\n    fmt.Println(\"1+...+100 =\", sum)\n    switch os := \"linux\"; os {\n    case \"linux\": fmt.Println(\"Linux\")\n    case \"darwin\": fmt.Println(\"macOS\")\n    }\n}",

    "title": "函数 — 代码的积木块",
    "desc": "<p>函数是<strong>可重复使用的代码单元</strong>。Go 的函数用 <code>func</code> 关键字声明，支持<strong>多返回值</strong>和<strong>闭包</strong>。</p>\n<h4>为什么需要函数？</h4><p>假设你要计算圆面积 10 次。不写函数的话要复制粘贴 10 遍 <code>3.14159 * r * r</code>。改需求（比如精确到更多位数）就要改 10 处！用函数只用改 1 处。</p>\n<h4>基本函数</h4>\n<pre><code>func add(a int, b int) int { return a + b }\nfunc add(a, b int) int { return a + b }  // 同类型可合并\n\nresult := add(3, 5)  // 调用 → 8</code></pre>\n<svg viewBox=\"0 0 520 160\" style=\"width:100%;max-width:520px;margin:12px 0;border-radius:6px;background:#1a2332;padding:10px\"><style>.t{fill:#e6edf3;font-size:12px;font-family:monospace}.tb{fill:#58a6ff;font-weight:bold;font-size:13px}.tl{stroke:#2d3b4f;stroke-width:1}.th{fill:#3fb950}.tr{fill:#f85149}.ty{fill:#d29922}</style>\n<text x=\"20\" y=\"22\" class=\"tb\">函数调用栈 — 先进后出</text><line x1=\"20\" y1=\"30\" x2=\"500\" y2=\"30\" class=\"tl\"/>\n<rect x=\"40\" y=\"40\" width=\"200\" height=\"28\" rx=\"4\" fill=\"#3fb950\" opacity=\"0.15\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"60\" y=\"59\" class=\"t\" fill=\"#3fb950\">main()</text>\n<line x1=\"60\" y1=\"68\" x2=\"60\" y2=\"78\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><polygon points=\"57,76 60,83 63,76\" fill=\"#58a6ff\"/>\n<rect x=\"40\" y=\"82\" width=\"200\" height=\"28\" rx=\"4\" fill=\"#d29922\" opacity=\"0.15\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"60\" y=\"101\" class=\"t\" fill=\"#d29922\">add(3,5) 执行中</text>\n<line x1=\"240\" y1=\"96\" x2=\"300\" y2=\"96\" stroke=\"#d29922\" stroke-width=\"1\" stroke-dasharray=\"3\"/><polygon points=\"298,92 308,96 298,100\" fill=\"#d29922\"/>\n<text x=\"310\" y=\"100\" class=\"t\" fill=\"#8b949e\">返回 8 给 main()</text>\n<text x=\"40\" y=\"140\" class=\"t\" fill=\"#8b949e\">每个函数调用在栈上分配栈帧：参数 + 局部变量 + 返回地址</text>\n<text x=\"40\" y=\"158\" class=\"t\" fill=\"#8b949e\">函数返回后栈帧自动释放</text></svg>\n<h4>多返回值</h4><p>这是 Go 的一个标志性特性。常用于返回结果+错误。</p>\n<pre><code>func div(a, b int) (int, error) {\n    if b == 0 {\n        return 0, errors.New(\"除数不能为 0\")\n    }\n    return a / b, nil\n}\n\nresult, err := div(10, 2)\nif err != nil { fmt.Println(err); return }\nfmt.Println(result)  // 5</code></pre>\n<h4>命名返回值</h4><p>返回值可以提前命名，就像声明变量一样。</p>\n<pre><code>func split(sum int) (x, y int) {\n    x = sum * 4 / 9\n    y = sum - x\n    return  // 裸返回，自动返回 x 和 y 的当前值\n}</code></pre>\n<h4>defer — 延迟执行</h4><p>defer 在函数<strong>返回前</strong>执行。常用于关闭文件、释放锁、记录耗时。</p>\n<pre><code>func readFile() {\n    f, _ := os.Open(\"data.txt\")\n    defer f.Close()  // 函数结束时自动执行\n    // ... 处理数据\n}\n\n// 多 defer 后进先出\nfunc example() {\n    defer fmt.Println(\"1\")  // 最后执行\n    defer fmt.Println(\"2\")  // 第二个执行\n    fmt.Println(\"3\")        // 最先执行\n}  // 输出: 3 2 1</code></pre>",
    "code": "package main\nimport \"fmt\"\nfunc add(a,b int) int { return a+b }\nfunc div(a,b int) (int,error) {\n    if b==0 { return 0, fmt.Errorf(\"zero\") }\n    return a/b, nil\n}\nfunc main() {\n    fmt.Println(add(3,5))\n    r,err := div(10,2)\n    if err!=nil { fmt.Println(err) } else { fmt.Println(r) }\n}",

    "desc": "<h4>数组 — 固定长度的序列</h4><p>数组是<strong>固定长度</strong>的元素序列。长度写在类型中：<code>[5]int</code> 和 <code>[3]int</code> 是不同</p>\n<p>的类型。</p>\n<svg viewBox=\"0 0 560 130\" style=\"width:100%;max-width:560px;margin:12px 0;border-radius:6px;background:#1a2332;padding:10px\"><style>.t{fill:#e6edf3;font-size:12px;font-family:monospace}.tb{fill:#58a6ff;font-weight:bold;font-size:13px}.tl{stroke:#2d3b4f;stroke-width:1}.th{fill:#3fb950}.tr{fill:#f85149}.ty{fill:#d29922}</style>\n<text x=\"20\" y=\"22\" class=\"tb\">数组内存 — arr := [5]int{10,20,30,40,50}</text><line x1=\"20\" y1=\"30\" x2=\"540\" y2=\"30\" class=\"tl\"/>\n<rect x=\"30\" y=\"38\" width=\"80\" height=\"32\" rx=\"3\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"70\" y=\"58\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">10</text>\n<rect x=\"110\" y=\"38\" width=\"80\" height=\"32\" rx=\"3\" fill=\"#58a6ff\" opacity=\"0.3\" stroke=\"#58a6ff\" stroke-width=\"1\"/><text x=\"150\" y=\"58\" class=\"t\" fill=\"#58a6ff\" text-anchor=\"middle\">20</text>\n<rect x=\"190\" y=\"38\" width=\"80\" height=\"32\" rx=\"3\" fill=\"#d29922\" opacity=\"0.3\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"230\" y=\"58\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">30</text>\n<rect x=\"270\" y=\"38\" width=\"80\" height=\"32\" rx=\"3\" fill=\"#f85149\" opacity=\"0.3\" stroke=\"#f85149\" stroke-width=\"1\"/><text x=\"310\" y=\"58\" class=\"t\" fill=\"#f85149\" text-anchor=\"middle\">40</text>\n<rect x=\"350\" y=\"38\" width=\"80\" height=\"32\" rx=\"3\" fill=\"#8b949e\" opacity=\"0.3\" stroke=\"#8b949e\" stroke-width=\"1\"/><text x=\"390\" y=\"58\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">50</text>\n<text x=\"30\" y=\"85\" class=\"t\" fill=\"#8b949e\">arr[0]  |  arr[1]  |  arr[2]  |  arr[3]  |  arr[4]</text>\n<text x=\"30\" y=\"105\" class=\"t\" fill=\"#8b949e\">连续内存，每个元素 8 字节（64位int），总 40 字节</text>\n<line x1=\"30\" y1=\"115\" x2=\"430\" y2=\"115\" stroke=\"#f85149\" stroke-width=\"1.5\"/>\n<text x=\"440\" y=\"118\" class=\"t\" fill=\"#f85149\">← 40 字节 →</text></svg>\n<pre><code>var arr [5]int               // [0 0 0 0 0]\narr2 := [3]int{10, 20, 30}  // 初始化\narr3 := [...]int{1,2,3,4}   // 自动推断长度\nfmt.Println(len(arr3))      // 4\n\n// 数组是值类型！赋值会复制整个数组\narr4 := arr2  // 复制一份，修改 arr4 不影响 arr2</code></pre>\n\n<h4>切片 — 动态长度的数组视图</h4>\n<p>数组长度固定是最大的限制。切片解决了这个问题——它像数组一样工作，但<strong>长度可以动态增长</strong>。</p>\n<svg viewBox=\"0 0 620 180\" style=\"width:100%;max-width:620px;margin:12px 0;border-radius:6px;background:#1a2332;padding:10px\"><style>.t{fill:#e6edf3;font-size:12px;font-family:monospace}.tb{fill:#58a6ff;font-weight:bold;font-size:13px}.tl{stroke:#2d3b4f;stroke-width:1}.th{fill:#3fb950}.tr{fill:#f85149}.ty{fill:#d29922}</style>\n<text x=\"20\" y=\"22\" class=\"tb\">切片内部 = 指针 + 长度 + 容量</text><line x1=\"20\" y1=\"30\" x2=\"600\" y2=\"30\" class=\"tl\"/>\n<rect x=\"30\" y=\"38\" width=\"140\" height=\"50\" rx=\"4\" fill=\"#58a6ff\" opacity=\"0.15\" stroke=\"#58a6ff\" stroke-width=\"1\"/>\n<text x=\"100\" y=\"55\" class=\"t\" fill=\"#58a6ff\" text-anchor=\"middle\">切片头 (24B)</text><line x1=\"45\" y1=\"60\" x2=\"155\" y2=\"60\" stroke=\"#2d3b4f\" stroke-width=\"0.5\"/>\n<text x=\"45\" y=\"75\" class=\"t\" fill=\"#58a6ff\">ptr ──→</text><text x=\"100\" y=\"88\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">len=5 cap=8</text>\n<line x1=\"170\" y1=\"63\" x2=\"210\" y2=\"63\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><polygon points=\"208,59 218,63 208,67\" fill=\"#58a6ff\"/>\n<rect x=\"220\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"245\" y=\"63\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">10</text>\n<rect x=\"270\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"295\" y=\"63\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">20</text>\n<rect x=\"320\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"345\" y=\"63\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">30</text>\n<rect x=\"370\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"395\" y=\"63\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">40</text>\n<rect x=\"420\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#3fb950\" opacity=\"0.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"445\" y=\"63\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">50</text>\n<rect x=\"470\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#2d3b4f\" stroke=\"#2d3b4f\" stroke-width=\"1\"/><text x=\"495\" y=\"63\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">-</text>\n<rect x=\"520\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#2d3b4f\" stroke=\"#2d3b4f\" stroke-width=\"1\"/><text x=\"545\" y=\"63\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">-</text>\n<rect x=\"570\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" fill=\"#2d3b4f\" stroke=\"#2d3b4f\" stroke-width=\"1\"/><text x=\"595\" y=\"63\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">-</text>\n<text x=\"240\" y=\"105\" class=\"t\" fill=\"#d29922\">len = 5（可访问 5 个元素）</text><line x1=\"220\" y1=\"110\" x2=\"470\" y2=\"110\" stroke=\"#d29922\" stroke-width=\"1.5\" stroke-dasharray=\"3\"/>\n<text x=\"240\" y=\"128\" class=\"t\" fill=\"#f85149\">cap = 8（底层数组总容量）</text><line x1=\"220\" y1=\"133\" x2=\"620\" y2=\"133\" stroke=\"#f85149\" stroke-width=\"1.5\" stroke-dasharray=\"3\"/>\n<text x=\"30\" y=\"155\" class=\"t\" fill=\"#3fb950\">📌 切片不存数据，它\"指向\"底层数组的某一段</text>\n<text x=\"30\" y=\"172\" class=\"t\" fill=\"#3fb950\">📌 append 超出 cap → 分配新数组（cap 加倍）</text></svg>\n<pre><code>// 创建切片\ns := []int{1,2,3}            // 字面量\ns := make([]int, 5)          // len=5, cap=5\ns := make([]int, 3, 5)       // len=3, cap=5 预分配\ns := arr[1:4]                // 从数组切出 [20 30 40]\n\n// 操作\ns = append(s, 4, 5)          // 追加\ncopy(dst, src)               // 复制\nfmt.Println(len(s), cap(s))  // 长度和容量\n\n// 遍历\nfor i, v := range s { fmt.Printf(\"s[%d]=%d\\n\", i, v) }</code></pre>",
    "code": "package main\nimport \"fmt\"\nfunc main() {\n    s := []int{2,3,5,7,11}\n    fmt.Println(\"原始:\", s, \"len:\", len(s), \"cap:\", cap(s))\n    s = append(s, 13, 17)\n    fmt.Println(\"追加后:\", s, \"len:\", len(s), \"cap:\", cap(s))\n    sub := s[1:4]\n    fmt.Println(\"sub[1:4]:\", sub)\n    for i,v := range s { fmt.Printf(\"s[%d]=%d\\n\",i,v) }\n}",

 148,78 138,82\" fill=\"#58a6ff\"/>\n<rect x=\"150\" y=\"62\" width=\"140\" height=\"32\" rx=\"3\" fill=\"#1a2332\" stroke=\"#58a6ff\" stroke-width=\"0.5\"/><text x=\"165\" y=\"82\" class=\"t\" fill=\"#58a6ff\">\"张三\" → 20</text>\n<rect x=\"150\" y=\"98\" width=\"140\" height=\"32\" rx=\"3\" fill=\"#1a2332\" stroke=\"#58a6ff\" stroke-width=\"0.5\"/><text x=\"165\" y=\"118\" class=\"t\" fill=\"#58a6ff\">\"王五\" → 21</text>\n<text x=\"30\" y=\"160\" class=\"t\" fill=\"#d29922\">⚠️ 遍历顺序随机！</text><text x=\"160\" y=\"160\" class=\"t\" fill=\"#d29922\">⚠️ nil map 写入会 panic</text></svg>\n<h4>常见陷阱</h4>\n<ul>\n<li><strong>nil map 不能写入：</strong> <code>var m map[string]int</code> 是 nil，必须用 <code>make</code> 或字面量创建</li>\n<li><strong>遍历顺序随机：</strong> 每次运行结果可能不同！不要依赖顺序</li>\n<li><strong>Map 是引用类型：</strong> 函数内修改会影响原 Map</li>\n<li><strong>读不存在的键返回零值：</strong> 用 <code>val, ok := m[key]</code> 判断是否存在</li>\n</ul>",

    "id": "struct",

    "title": "结构体 — 自定义类型",
    "desc": "<p>结构体把<strong>多个相关字段打包成一个新类型</strong>，就像一张登记表。它是 Go 面向对象编程的基础。如果你熟悉 C 语言的 struct 或 Java 的 class，可以类比理解。</p>\n<h4>为什么需要结构体？</h4><p>假设你要处理学生信息。没有结构体时必须维护多个平行切片：</p>\n<pre><code>names := []string{\"Alice\", \"Bob\"}\nages  := []int{30, 25}\n// 找 Bob 的年龄：先找到 name 的索引，再去 ages 取\n// 容易出错，而且添加新字段（如城市）要改所有代码</code></pre>\n<p>用结构体把相关信息打包在一起：</p>\n<pre><code>type Person struct {\n    Name string\n    Age  int\n    City string\n}\n\nalice := Person{Name:\"Alice\", Age:30, City:\"Beijing\"}\nbob := Person{Name:\"Bob\", Age:25}\nfmt.Println(alice.Name, bob.Age)</code></pre>\n<h4>创建方式</h4>\n<pre><code>p1 := Person{Name:\"Alice\", Age:30}   // 指定字段名（推荐，清晰）\np2 := Person{\"Bob\", 25, \"Shanghai\"}  // 按顺序（不推荐，字段顺序变了会出错）\np3 := &Person{Name:\"Charlie\"}        // 指针（Age=\"\", City=\"\"）\np4 := new(Person)                    // &Person{} 的简写</code></pre>\n<h4>方法 — 带接收者的函数</h4>\n<pre><code>// 值接收者：方法操作的是结构体副本，不影响原对象\nfunc (p Person) Greet() string {\n    return \"Hi, I'm \" + p.Name + \" (\" + strconv.Itoa(p.Age) + \")\"\n}\n\n// 指针接收者：方法操作的是原对象，可以修改字段\nfunc (p *Person) Birthday() {\n    p.Age++\n}\n\nalice := Person{Name:\"Alice\", Age:30}\nfmt.Println(alice.Greet())  // Hi, I'm Alice (30)\nalice.Birthday()\nfmt.Println(alice.Age)      // 31（被方法修改了）</code></pre>\n<h4>值接收者 vs 指针接收者</h4>\n<table border=\"1\" cellpadding=\"4\" style=\"border-collapse:collapse;border-color:#2d3b4f;margin:8px 0\">\n<tr style=\"background:#1a2332\"><th style=\"padding:6px 12px\">对比</th><th style=\"padding:6px 12px\">值接收者 func(p Person)</th><th style=\"padding:6px 12px\">指针接收者 func(p *Person)</th></tr>\n<tr><td>能否修改原字段</td><td>❌ 操作的是副本</td><td>✅ 操作的是原对象</td></tr>\n<tr><td>性能（大结构体）</td><td>复制整个结构体（慢）</td><td>复制指针 8 字节（快）</td></tr>\n<tr><td>nil 安全</td><td>安全（不会 nil）</td><td>需在方法内判断 nil</td></tr></table>\n<p><strong>经验法则</strong>：不确定时用指针接收者。只有小型不可变值类型（如 <code>time.Time</code>、<code>Color</code>）用值接收者。</p>",
    "code": "package main\nimport \"fmt\"\ntype Rect struct { W,H float64 }\nfunc (r Rect) Area() float64 { return r.W*r.H }\nfunc (r *Rect) Scale(f float64) { r.W*=f; r.H*=f }\nfunc main() {\n    r:=Rect{10,5}\n    fmt.Println(\"Area:\",r.Area())\n    r.Scale(2)\n    fmt.Println(\"After:\",r)\n}",

    "desc": "<p>接口定义<strong>行为契约</strong>——一组方法签名。Go 的接口是<strong>隐式实现</strong>的：一个类型只要实现了接口里所有的方法，它就自动满足该接口，不需要显式声明 implements。</p>\n<h4>为什么叫\"鸭子类型\"？</h4><p>\"如果它走起来像鸭子、叫起来像鸭子，那它就是鸭子。\"——类型不需要说\"我实现了 Shape\"，Go 编译器自动检查：如果你有 Area() 方法，那你就实现了 Shape 接口。</p>\n<h4>解决什么问题？</h4><p>没有接口时：</p>\n<pre><code>func printCircleArea(c Circle) { fmt.Println(c.Area()) }\nfunc printSquareArea(s Square) { fmt.Println(s.Area()) }\n// 每新增一种形状就要写一个新函数</code></pre>\n<p>用接口后：</p>\n<pre><code>type Shape interface { Area() float64 }\nfunc printArea(s Shape) {\n    fmt.Printf(\"面积: %.2f\\n\", s.Area())\n}\n// 任何有 Area() 方法的类型都能传入！</code></pre>\n<h4>接口值内部结构</h4><p>接口变量底层存储 (type, value) 对。当 <code>var s Shape = Circle{5}</code> 时，s 内部存的是 (<strong>*Circle</strong>, <strong>&{R:5}</strong>)。</p>\n<p><strong>重要陷阱：</strong> 接口为 nil 仅当 type 和 value 都是 nil。</p>\n<pre><code>var c *Circle = nil  // c 是 nil 指针\nvar s Shape = c      // s 的 type = *Circle, value = nil\nfmt.Println(s == nil)  // false！因为 type 部分不是 nil</code></pre>\n<h4>空接口 interface{}</h4><p>空接口没有方法，所以任何类型都满足空接口——类似 Java 的 Object。</p>\n<pre><code>var v interface{} = 42\nv = \"hello\"\nv = []int{1,2,3}\n\n// 安全类型断言\ns, ok := v.(string)\nif ok { fmt.Println(\"字符串:\", s) }\n\n// 类型 switch\nswitch vv := v.(type) {\ncase int:    fmt.Println(\"整数:\", vv)\ncase string: fmt.Println(\"字符串:\", vv)\ndefault:     fmt.Printf(\"其他: %T\\n\", vv)\n}</code></pre>",
    "code": "package main\nimport (\"fmt\";\"math\")\ntype Shape interface { Area() float64 }\ntype Circle struct { R float64 }\nfunc (c Circle) Area() float64 { return math.Pi*c.R*c.R }\ntype Rect struct { W,H float64 }\nfunc (r Rect) Area() float64 { return r.W*r.H }\nfunc main() {\n    for _,s := range []Shape{Circle{5},Rect{3,4}} {\n        fmt.Printf(\"%T: %.2f\\n\",s,s.Area())\n    }\n}",

    "id": "error",
    "icon": "⚠️",
    "title": "错误处理 — 优雅面对失败",
    "desc": "<p>Go 没有 try/catch、没有 throw。错误就是一个<strong>实现了 error 接口的普通值</strong>，通过函数返回值显式返回。你必须自己检查每个错误——这迫使你写出更健壮的代码。</p>\n<h4>error 接口定义</h4>\n<pre><code>type error interface {\n    Error() string\n}\n\n// 创建错误\nerrors.New(\"出错了\")\nfmt.Errorf(\"第 %d 行出错\", 42)</code></pre>\n<h4>基本模式：始终检查错误</h4>\n<pre><code>// 返回错误的函数\nfunc parseInt(s string) (int, error) {\n    n, err := strconv.Atoi(s)\n    if err != nil {\n        return 0, fmt.Errorf(\"解析 '%s' 失败: %w\", s, err)\n    }\n    return n, nil\n}\n\n// 调用方必须检查\nn, err := parseInt(\"123\")\nif err != nil {\n    fmt.Println(\"错误:\", err)\n    return\n}\nfmt.Println(\"数字:\", n)</code></pre>\n<h4>自定义错误</h4>\n<pre><code>type ValidationError struct {\n    Field string\n    Value interface{}\n}\n\nfunc (e *ValidationError) Error() string {\n    return fmt.Sprintf(\"字段 '%s' 值 %v 无效\", e.Field, e.Value)\n}\n\n// 判断具体错误类型\nvar ve *ValidationError\nif errors.As(err, &ve) {\n    fmt.Printf(\"字段 %s 无效，收到值: %v\\n\", ve.Field, ve.Value)\n}</code></pre>\n<h4>错误包装（Go 1.13+）</h4>\n<pre><code>// %w 创建错误链\nif err != nil {\n    return fmt.Errorf(\"操作失败: %w\", err)\n}\n\n// errors.Is 遍历链查找特定错误\nif errors.Is(err, os.ErrNotExist) {\n    fmt.Println(\"文件不存在\")\n}\n\n// errors.As 遍历链查找特定类型\nvar pe *os.PathError\nif errors.As(err, &pe) {\n    fmt.Printf(\"路径 %s 操作失败: %v\\n\", pe.Path, pe.Err)\n}</code></pre>\n<h4>最佳实践</h4>\n<ul><li>✅ 总是检查 <code>err != nil</code></li><li>✅ 用 <code>fmt.Errorf(\"上下文: %w\", err)</code> 包装错误</li><li>✅ 用 <code>errors.Is</code> 和 <code>errors.As</code> 判断错误</li><li>❌ 不要忽略错误：<code>result, _ := someFunc()</code></li><li>❌ 不要在常规逻辑中使用 <code>panic</code></li></ul>",
    "code": "package main\nimport (\"errors\";\"fmt\")\nfunc safeDiv(a,b int)(int,error){\n    if b==0 { return 0, errors.New(\"zero\") }\n    return a/b, nil\n}\nfunc main() {\n    r,err:=safeDiv(10,0)\n    if err!=nil{ fmt.Println(\"Err:\",err) }else{ fmt.Println(r) }\n    r,err=safeDiv(10,2)\n    if err==nil{ fmt.Println(\"Result:\",r) }\n}",

    "id": "goroutine",

    "title": "Goroutine — 轻量级并发",
    "desc": "<p>Goroutine 是 Go 最强大的特性之一。它是一个<strong>轻量级的执行线程</strong>，由 Go 运行时管理，而不是操作系统。创建一个 goroutine 只需要 ~4KB 的栈空间（相比 OS 线程的 ~2MB），所以你可以轻松创建上百万个。</p>\n<svg viewBox=\"0 0 580 180\" style=\"width:100%;max-width:580px;margin:12px 0;border-radius:6px;background:#1a2332;padding:10px\"><style>.t{fill:#e6edf3;font-size:12px;font-family:monospace}.tb{fill:#58a6ff;font-weight:bold;font-size:13px}.tl{stroke:#2d3b4f;stroke-width:1}.th{fill:#3fb950}.tr{fill:#f85149}.ty{fill:#d29922}</style>\n<text x=\"20\" y=\"22\" class=\"tb\">Go 调度器 — GMP 模型</text><line x1=\"20\" y1=\"30\" x2=\"560\" y2=\"30\" class=\"tl\"/>\n<rect x=\"30\" y=\"38\" width=\"60\" height=\"22\" rx=\"3\" fill=\"#3fb950\" opacity=\"0.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"60\" y=\"53\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">G1</text>\n<rect x=\"30\" y=\"64\" width=\"60\" height=\"22\" rx=\"3\" fill=\"#58a6ff\" opacity=\"0.2\" stroke=\"#58a6ff\" stroke-width=\"1\"/><text x=\"60\" y=\"79\" class=\"t\" fill=\"#58a6ff\" text-anchor=\"middle\">G2</text>\n<rect x=\"30\" y=\"90\" width=\"60\" height=\"22\" rx=\"3\" fill=\"#d29922\" opacity=\"0.2\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"60\" y=\"105\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">G3</text>\n<rect x=\"30\" y=\"116\" width=\"60\" height=\"22\" rx=\"3\" fill=\"#f85149\" opacity=\"0.2\" stroke=\"#f85149\" stroke-width=\"1\"/><text x=\"60\" y=\"131\" class=\"t\" fill=\"#f85149\" text-anchor=\"middle\">G4</text>\n<text x=\"60\" y=\"156\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">Goroutine 队列</text>\n<line x1=\"90\" y1=\"70\" x2=\"150\" y2=\"70\" stroke=\"#58a6ff\" stroke-width=\"0.5\"/><line x1=\"90\" y1=\"101\" x2=\"150\" y2=\"101\" stroke=\"#d29922\" stroke-width=\"0.5\"/>\n<rect x=\"160\" y=\"55\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#d29922\" stroke=\"#d29922\" stroke-width=\"1.5\"/><text x=\"190\" y=\"73\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">P0</text>\n<rect x=\"160\" y=\"95\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#d29922\" stroke=\"#d29922\" stroke-width=\"1.5\"/><text x=\"190\" y=\"113\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">P1</text>\n<text x=\"190\" y=\"156\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">Processor</text>\n<line x1=\"220\" y1=\"69\" x2=\"290\" y2=\"69\" stroke=\"#d29922\" stroke-width=\"0.5\"/><line x1=\"220\" y1=\"109\" x2=\"290\" y2=\"109\" stroke=\"#d29922\" stroke-width=\"0.5\"/>\n<rect x=\"300\" y=\"55\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#f85149\" stroke=\"#f85149\" stroke-width=\"1.5\"/><text x=\"330\" y=\"73\" class=\"t\" fill=\"#f85149\" text-anchor=\"middle\">M0</text>\n<rect x=\"300\" y=\"95\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#f85149\" stroke=\"#f85149\" stroke-width=\"1.5\"/><text x=\"330\" y=\"113\" class=\"t\" fill=\"#f85149\" text-anchor=\"middle\">M1</text>\n<text x=\"330\" y=\"156\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">OS Thread</text>\n<line x1=\"360\" y1=\"69\" x2=\"420\" y2=\"69\" stroke=\"#f85149\" stroke-width=\"0.5\"/><line x1=\"360\" y1=\"109\" x2=\"420\" y2=\"109\" stroke=\"#f85149\" stroke-width=\"0.5\"/>\n<rect x=\"430\" y=\"55\" width=\"80\" height=\"28\" rx=\"4\" fill=\"#1a2332\" stroke=\"#8b949e\" stroke-width=\"1\"/><text x=\"470\" y=\"73\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">CPU0</text>\n<rect x=\"430\" y=\"95\" width=\"80\" height=\"28\" rx=\"4\" fill=\"#1a2332\" stroke=\"#8b949e\" stroke-width=\"1\"/><text x=\"470\" y=\"113\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">CPU1</text><text x=\"470\" y=\"156\" class=\"t\" fill=\"#8b949e\" text-anchor=\"middle\">CPU</text>\n<text x=\"30\" y=\"178\" class=\"t\" fill=\"#8b949e\">G(4KB) → P(逻辑核) → M(OS线程) → CPU(硬件)</text></svg>\n<h4>基本使用</h4>\n<pre><code>func say(s string) {\n    for i:=0; i<3; i++ {\n        time.Sleep(100*time.Millisecond)\n        fmt.Println(s)\n    }\n}\n\nfunc main() {\n    go say(\"🌍 世界\")  // 新 goroutine\n    say(\"👋 你好\")     // main goroutine 同时执行\n}\n// 输出交替出现（顺序可能不同）</code></pre>\n\n<h4>等待 goroutine — sync.WaitGroup</h4>\n<pre><code>func worker(id int, wg *sync.WaitGroup) {\n    defer wg.Done()  // 必须调用 Done()\n    fmt.Printf(\"Worker %d 开始\\n\", id)\n    time.Sleep(time.Second)\n}\n\nfunc main() {\n    var wg sync.WaitGroup\n    for i:=1; i<=3; i++ {\n        wg.Add(1)            // 计数器 +1\n        go worker(i, &wg)     // 启动 goroutine\n    }\n    wg.Wait()  // 阻塞直到计数器归零\n    fmt.Println(\"全部完成\")\n}</code></pre>\n\n<h4>常见陷阱</h4>\n<ul>\n<li><strong>循环变量捕获：</strong> 在 for 循环中启动 goroutine 必须传参 <code>go func(id int) { ... }(i)</code></li>\n<li><strong>goroutine 泄漏：</strong> goroutine 读 channel 但没人写 → 永远阻塞 → 内存泄漏</li>\n</ul>",
    "code": "package main\nimport (\"fmt\";\"sync\";\"time\")\nfunc worker(id int,wg *sync.WaitGroup) {\n    defer wg.Done()\n    fmt.Printf(\"W%d start\\n\",id)\n    time.Sleep(time.Second)\n    fmt.Printf(\"W%d done\\n\",id)\n}\nfunc main() {\n    var wg sync.WaitGroup\n    for i:=1;i<=3;i++{ wg.Add(1); go worker(i,&wg) }\n    wg.Wait()\n    fmt.Println(\"All done\")\n}",

  {
    "id": "channel",
    "icon": "🔗",
    "title": "Channel — 协程通信",
    "desc": "<p>Channel 是 goroutine 之间的<strong>通信管道</strong>。Go 的核心理念：<strong>不要通过共享内存来通信，而要通过通信来共享内存</strong>。</p>\n<h4>为什么需要 Channel？</h4><p>Goroutine A 计算了一个结果，Goroutine B 需要这个结果。没有 channel 的话，你得用共享变量 + 锁。channel 让数据在 goroutine 之间安全地流动。</p>\n<h4>两种 Channel</h4>\n<svg viewBox=\"0 0 580 180\" style=\"width:100%;max-width:580px;margin:12px 0;border-radius:6px;background:#1a2332;padding:10px\"><style>.t{fill:#e6edf3;font-size:12px;font-family:monospace}.tb{fill:#58a6ff;font-weight:bold;font-size:13px}.tl{stroke:#2d3b4f;stroke-width:1}.th{fill:#3fb950}.tr{fill:#f85149}.ty{fill:#d29922}</style>\n<text x=\"20\" y=\"22\" class=\"tb\">无缓冲 Channel vs 有缓冲 Channel</text><line x1=\"20\" y1=\"30\" x2=\"560\" y2=\"30\" class=\"tl\"/>\n<text x=\"30\" y=\"52\" class=\"t\" fill=\"#58a6ff\" font-weight=\"bold\">无缓冲（同步）</text>\n<rect x=\"30\" y=\"60\" width=\"90\" height=\"28\" rx=\"4\" fill=\"#3fb950\" opacity=\"0.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"75\" y=\"79\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">发送方</text>\n<line x1=\"120\" y1=\"74\" x2=\"200\" y2=\"74\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><polygon points=\"198,70 208,74 198,78\" fill=\"#58a6ff\"/>\n<text x=\"220\" y=\"78\" class=\"t\" fill=\"#f85149\">双方必须同时准备好</text>\n<rect x=\"360\" y=\"60\" width=\"90\" height=\"28\" rx=\"4\" fill=\"#d29922\" opacity=\"0.2\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"405\" y=\"79\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">接收方</text>\n<line x1=\"360\" y1=\"74\" x2=\"280\" y2=\"74\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><polygon points=\"282,70 272,74 282,78\" fill=\"#58a6ff\"/>\n<text x=\"30\" y=\"110\" class=\"t\" fill=\"#58a6ff\" font-weight=\"bold\">有缓冲（异步）</text>\n<rect x=\"30\" y=\"118\" width=\"90\" height=\"28\" rx=\"4\" fill=\"#3fb950\" opacity=\"0.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"75\" y=\"137\" class=\"t\" fill=\"#3fb950\" text-anchor=\"middle\">发送方</text>\n<line x1=\"120\" y1=\"132\" x2=\"180\" y2=\"132\" stroke=\"#58a6ff\" stroke-width=\"1\"/><polygon points=\"178,128 188,132 178,136\" fill=\"#58a6ff\"/>\n<rect x=\"190\" y=\"115\" width=\"120\" height=\"34\" rx=\"17\" fill=\"#58a6ff\" opacity=\"0.1\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><text x=\"250\" y=\"133\" class=\"t\" fill=\"#58a6ff\" text-anchor=\"middle\">缓冲区 [3/10]</text>\n<line x1=\"310\" y1=\"132\" x2=\"370\" y2=\"132\" stroke=\"#58a6ff\" stroke-width=\"1\"/><polygon points=\"368,128 378,132 368,136\" fill=\"#58a6ff\"/>\n<rect x=\"380\" y=\"118\" width=\"90\" height=\"28\" rx=\"4\" fill=\"#d29922\" opacity=\"0.2\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"425\" y=\"137\" class=\"t\" fill=\"#d29922\" text-anchor=\"middle\">接收方</text>\n<text x=\"30\" y=\"170\" class=\"t\" fill=\"#8b949e\">缓冲未满时发送不阻塞，未空时接收不阻塞</text></svg>\n<h4>完整用法</h4>\n<pre><code>// 创建\nch := make(chan int)             // 无缓冲\nch := make(chan int, 100)         // 有缓冲\n\n// 发送与接收\nch <- 42          // 发送\nval := <-ch       // 接收\nclose(ch)         // 关闭\n\n// 只读/只写限制（函数参数）\nfunc producer(out chan<- int) { out <- 42 }  // 只写\nfunc consumer(in <-chan int) { x := <-in }   // 只读\n\n// 遍历\nfor v := range ch {  // 自动在 close 时退出\n    fmt.Println(v)\n}\n\n// 判断是否关闭\nv, ok := <-ch\nif !ok { fmt.Println(\"channel 已关闭\") }</code></pre>\n<h4>常见陷阱</h4>\n<ul>\n<li>向已关闭的 channel 发送 → panic</li>\n<li>从已关闭的 channel 接收 → 返回零值（不阻塞）</li>\n<li>nil channel 发送/接收 → 永久阻塞</li>\n<li>不关闭 channel → goroutine 泄漏（for range 无法退出）</li>\n</ul>",
    "code": "package main\nimport \"fmt\"\nfunc sum(s []int,ch chan int) {\n    sum:=0; for _,v:=range s{sum+=v}\n    ch<-sum\n}\nfunc main() {\n    s:=[]int{1,2,3,4,5,6}\n    ch:=make(chan int)\n    go sum(s[:3],ch); go sum(s[3:],ch)\n    x,y:=<-ch,<-ch\n    fmt.Println(x,y,x+y)\n}",

// ==================== 练习进度持久化 ====================
function loadProgress() {
  try {
    const saved = localStorage.getItem('go-tutorial-progress');
    if (saved) exerciseResults = JSON.parse(saved);
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem('go-tutorial-progress', JSON.stringify(exerciseResults));
  } catch(e) {}
}

function markExerciseDone(sectionId, exerciseId) {
  if (!exerciseResults[sectionId]) exerciseResults[sectionId] = {};
  exerciseResults[sectionId][exerciseId] = true;
  saveProgress();
}

// ==================== 工具函数 ====================
function toPythonLiteral(val) {
  if (val === null || val === undefined) return 'None';
  if (typeof val === 'boolean') return val ? 'True' : 'False';
  if (typeof val === 'number') {
    if (Number.isInteger(val) && Math.abs(val) < 1e15) return String(val);
    return String(val);
  }
  if (typeof val === 'string') {
    const escaped = val.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
    return "'" + escaped + "'";
  }
  if (Array.isArray(val)) return '[' + val.map(toPythonLiteral).join(', ') + ']';
  if (typeof val === 'object') {
    const items = Object.entries(val).map(([k, v]) => toPythonLiteral(k) + ': ' + toPythonLiteral(v));
    return '{' + items.join(', ') + '}';
  }
  return String(val);
}

function formatValue(val) {
  if (val === null) return 'None';
  if (val === undefined) return 'None';
  if (typeof val === 'object') {
    try { return JSON.stringify(val, null, 2); }
    catch(e) { return String(val); }
  }
  return String(val);
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 代码缓存 ====================
function cacheKey() {
  if (currentTab === 'learn' || currentExerciseIndex === -1) return 'go-' + currentSectionId;
  return 'go-' + currentSectionId + '-' + currentExerciseIndex;
}

function saveCode() {
  if (!editor) return;
  try { localStorage.setItem(cacheKey(), editor.getValue()); } catch(e) {}
}

function loadCachedCode(fallback) {
  try {
    const cached = localStorage.getItem(cacheKey());
    return cached !== null ? cached : fallback;
  } catch(e) { return fallback; }
}

function clearCachedCode() {
  try { localStorage.removeItem(cacheKey()); } catch(e) {}
}

function runCode() {
  if (isRunning || !editor) return;
  const code = editor.getValue();

  isRunning = true;
  const btn = document.getElementById('run-btn');
  const output = document.getElementById('output');
  const outputContent = document.getElementById('output-content');
  const statusEl = document.getElementById('output-status');
  if (btn) btn.classList.add('running');
  output.classList.add('show');
  outputContent.innerHTML = '<span class="out-info">⏳ 正在执行 ...</span>';

  _runGo(code, 
    function(stdout) {
      const out = stdout || '';
      outputContent.innerHTML = out
        ? escHtml(out).replace(/\n/g, '<br>')
        : '<span class="out-info">\u2713 代码已执行（无输出）</span>';
      if (statusEl) statusEl.innerHTML = '<span class="badge success">\u2713 执行成功</span>';
      if (btn) btn.classList.remove('running');
      isRunning = false;
    },
    function(stderr) {
      outputContent.innerHTML = '<span class="out-err">\u26D4 ' + escHtml(stderr) + '</span>';
      if (statusEl) statusEl.innerHTML = '<span class="badge error">\u2717 执行失败</span>';
      if (btn) btn.classList.remove('running');
      isRunning = false;
    }
  );
}

function submitExercise() {
  if (isRunning || !editor) return;
  isRunning = true;

  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (!section || !section.exercises || currentExerciseIndex < 0) {
    isRunning = false;
    return;
  }

  const exercise = section.exercises[currentExerciseIndex];
  const userCode = editor.getValue();
  const output = document.getElementById('output');
  const outputContent = document.getElementById('output-content');
  const statusEl = document.getElementById('output-status');
  const submitBtn = document.getElementById('submit-btn');
  const runBtn = document.getElementById('run-btn');

  output.classList.add('show');
  outputContent.innerHTML = '<span class="out-info">⏳ 正在判题 ...</span>';
  if (submitBtn) submitBtn.classList.add('running');

  if (!exercise.tests || exercise.tests.length === 0) {
    outputContent.innerHTML = '<span class="out-info">此练习无测试用例，请点击"运行代码"查看输出。</span>';
    if (statusEl) statusEl.innerHTML = '';
    if (submitBtn) submitBtn.classList.remove('running');
    isRunning = false;
    return;
  }

  if (!exercise.fn) {
    outputContent.innerHTML = '<span class="out-info">此练习需要手动验证，请点击"运行代码"查看输出。</span>';
    if (statusEl) statusEl.innerHTML = '';
    if (submitBtn) submitBtn.classList.remove('running');
    isRunning = false;
    return;
  }

  var testsWithNoExpect = exercise.tests.every(function(t) { return t.noexpect; });
  if (testsWithNoExpect) {
    outputContent.innerHTML = '<span class="out-info">此练习需要手动验证，请点击"运行代码"查看输出。</span>';
    if (statusEl) statusEl.innerHTML = '';
    if (submitBtn) submitBtn.classList.remove('running');
    isRunning = false;
    return;
  }

  _runGoTest(userCode, exercise.fn, exercise.tests,
    function(result) {
      if (submitBtn) submitBtn.classList.remove('running');
      if (runBtn) runBtn.classList.remove('running');
      isRunning = false;

      if (result.error) {
        outputContent.innerHTML = '<span class="out-err">\u26D4 ' + escHtml(result.error) + '</span>';
        if (statusEl) statusEl.innerHTML = '<span class="badge error">\u2717 编译失败</span>';
        return;
      }

      var results = result.results;
      if (!results || results.length === 0) {
        outputContent.innerHTML = '<span class="out-info">无测试结果</span>';
        return;
      }

      var allPassed = true;
      var html = '';
      for (var i = 0; i < results.length; i++) {
        var r = results[i];
        if (r.error) {
          allPassed = false;
          html += '<div class="result-item fail">'
            + '<span class="icon fail">\u2717</span>'
            + '<div class="detail">'
            + '<div>测试 ' + (i + 1) + ': ' + escHtml(r.args) + '</div>'
            + '<div class="got">错误: ' + escHtml(r.error) + '</div>'
            + '</div></div>';
        } else if (r.passed) {
          html += '<div class="result-item pass">'
            + '<span class="icon pass">\u2713</span>'
            + '<div class="detail">'
            + '<div>测试 ' + (i + 1) + ': ' + escHtml(r.args) + '</div>'
            + '<div class="expected">结果: ' + escHtml(String(r.got)) + '</div>'
            + '</div></div>';
        } else {
          allPassed = false;
          html += '<div class="result-item fail">'
            + '<span class="icon fail">\u2717</span>'
            + '<div class="detail">'
            + '<div>测试 ' + (i + 1) + ': ' + escHtml(r.args) + '</div>'
            + '<div class="got">输出: ' + escHtml(String(r.got)) + '</div>'
            + '<div class="expected">期望: ' + escHtml(String(r.expected)) + '</div>'
            + '</div></div>';
        }
      }

      html += '<div class="result-summary ' + (allPassed ? 'all-pass' : 'has-fail') + '">'
        + (allPassed ? '\uD83C\uDF89 全部通过！' : '\u274C 部分测试未通过')
        + '</div>';

      outputContent.innerHTML = html;
      if (statusEl) statusEl.innerHTML = allPassed
        ? '<span class="badge success">\u2713 全部通过</span>'
        : '<span class="badge error">\u2717 未完全通过</span>';

      if (allPassed) {
        markExerciseDone(currentSectionId, exercise.id);
        renderSidebar();
        renderTabs();
      }
    }
  );
}

// ==================== 侧边栏 ====================
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  sidebar.innerHTML = SECTIONS.map((s, i) => {
    const done = exerciseResults[s.id];
    const count = s.exercises ? s.exercises.length : 0;
    const doneCount = done ? Object.keys(done).length : 0;
    const doneMark = count > 0 && doneCount >= count ? ' <span class="done">✓全部</span>' : '';
    return '<a class="section" data-id="' + s.id + '" href="javascript:void(0)">'
      + '<span class="num">' + (i + 1) + '.</span> ' + (s.icon || '') + ' ' + s.title + doneMark
    + '</a>';
  }).join('<div class="divider"></div>');
  sidebar.addEventListener('click', (e) => {
    const el = e.target.closest('.section');
    if (el) {
      const id = el.dataset.id;
      if (id !== currentSectionId) {
        loadSection(id);
        document.getElementById('sidebar').classList.remove('open');
      }
    }
  });
}

function highlightSidebar(id) {
  document.querySelectorAll('#sidebar .section').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ==================== 章节加载 ====================
function loadSection(id) {
  const section = SECTIONS.find(s => s.id === id);
  if (!section) return;
  currentSectionId = id;
  currentTab = 'learn';
  currentExerciseIndex = -1;

  document.getElementById('section-title').textContent = section.title;
  document.getElementById('section-desc').innerHTML = section.desc;
  document.getElementById('content').scrollTop = 0;
  highlightSidebar(id);
  document.getElementById('output').classList.remove('show');

  updateProgress(section);
  renderTabs(section);

  document.getElementById('section-desc').style.display = 'block';
  document.getElementById('exercise-area').classList.remove('show');
  document.getElementById('submit-btn').classList.remove('show');
  document.getElementById('hint-btn').classList.remove('show');
  document.getElementById('back-btn').classList.remove('show');

  if (editor) {
    editor.setValue(section.code);
    }
}

function updateProgress(section) {
  const el = document.getElementById('section-progress');
  if (!section.exercises || section.exercises.length === 0) {
    el.textContent = '';
    return;
  }
  const done = exerciseResults[section.id] || {};
  const doneCount = Object.keys(done).length;
  const total = section.exercises.length;
  el.textContent = '练习进度: ' + doneCount + '/' + total + (doneCount >= total ? ' 🎉 全部完成!' : '');
}

  let html = '<div class="section-tab active" data-tab="learn">📖 学习</div>';
  if (section.exercises) {
    section.exercises.forEach((ex, i) => {
      const done = exerciseResults[section.id] && exerciseResults[section.id][ex.id];
      html += '<div class="section-tab' + (done ? ' done' : '') + '" data-tab="' + i + '">练习 ' + (i+1) + (done ? '<span class="check">✓</span>' : '') + '</div>';
    });
  }
  tabsEl.innerHTML = html;

  tabsEl.querySelectorAll('.section-tab').forEach(el => {
    el.addEventListener('click', () => {
      const tab = el.dataset.tab;
      if (tab === 'learn') {
        switchToLearn(section);
      } else {
        switchToExercise(section, parseInt(tab));
      }
    });
  });
}

function switchToLearn(section) {
  currentTab = 'learn';
  currentExerciseIndex = -1;

  document.querySelectorAll('#section-tabs .section-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === 'learn');
  });

  document.getElementById('section-desc').style.display = 'block';
  document.getElementById('exercise-area').classList.remove('show');
  document.getElementById('submit-btn').classList.remove('show');
  document.getElementById('hint-btn').classList.remove('show');
  document.getElementById('back-btn').classList.remove('show');
  document.getElementById('output').classList.remove('show');

  if (editor) {
    editor.setValue(loadCachedCode(section.code));
    }
}

function switchToExercise(section, index) {
  if (!section.exercises || !section.exercises[index]) return;

  currentTab = 'exercise';
  currentExerciseIndex = index;
  const ex = section.exercises[index];

  document.querySelectorAll('#section-tabs .section-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === String(index));
  });

  document.getElementById('section-desc').style.display = 'none';
  document.getElementById('exercise-area').classList.add('show');
  document.getElementById('exercise-title').textContent = ex.title;
  document.getElementById('exercise-desc').innerHTML = ex.desc;
  document.getElementById('exercise-hint').innerHTML = ex.hint || '';
  document.getElementById('exercise-hint').classList.remove('show');
  document.getElementById('submit-btn').classList.add('show');
  document.getElementById('hint-btn').classList.add('show');
  document.getElementById('back-btn').classList.add('show');
  document.getElementById('output').classList.remove('show');

  if (editor) {
    editor.setValue(loadCachedCode(ex.starterCode));
    }
}

function goBackToLearn() {
  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (section) switchToLearn(section);
}

function toggleHint() {
  const hint = document.getElementById('exercise-hint');
  hint.classList.toggle('show');
  document.getElementById('hint-btn').textContent = hint.classList.contains('show') ? '隐藏提示' : '查看提示';
}

function createEditor() {
  if (editorReady) return;
  editorReady = true;

  require.config({
    paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }
  });

  require(['vs/editor/editor.main'], () => {
    const container = document.getElementById('editor-container');
    if (!container) return;
    container.classList.remove('loading');
    container.innerHTML = '';
    container.style.height = '380px';

    const savedTheme = localStorage.getItem('go-theme') || 'light';
    const isLight = savedTheme === 'light';
    if (isLight) document.body.classList.add('light');
    const monacoTheme = isLight ? 'vs' : 'vs-dark';

    editor = monaco.editor.create(container, {
      value: loadCachedCode(SECTIONS[0].code),
      language: 'go',
      theme: monacoTheme,
      minimap: { enabled: false },
      fontSize: 14,
      lineNumbers: 'on',
      scrollBeyondLastLine: false,
      automaticLayout: true,
      wordWrap: 'on',
      tabSize: 4,
      renderWhitespace: 'selection',
      padding: { top: 12 },
    });

    loadSection(currentSectionId);

    let saveTimer;
    editor.onDidChangeModelContent(() => {
      const lineCount = editor.getModel().getLineCount();
      const newHeight = Math.min(Math.max(lineCount * 22, 200), 600);
      container.style.height = newHeight + 'px';
      editor.layout();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCode, 500);
    });
  });
}


function resetCode() {
  if (!editor) return;
  clearCachedCode();
  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (currentTab === 'learn' || currentExerciseIndex === -1) {
    editor.setValue(section.code);
  } else if (section.exercises && section.exercises[currentExerciseIndex]) {
    editor.setValue(section.exercises[currentExerciseIndex].starterCode);
  }
  document.getElementById('output').classList.remove('show');
}

// ==================== 主题切换 ====================
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('go-theme', isLight ? 'light' : 'dark');
  if (editor) monaco.editor.setTheme(isLight ? 'vs' : 'vs-dark');
}

// ==================== 字号控制 ====================
function setFontSize(level) {
  const sizes = {
    small: { base:'13px', mono:'12px', title:'22px', desc:'13px', code:'12px', small:'11px', sidebar:'12px', tab:'12px' },
    medium: { base:'15px', mono:'14px', title:'26px', desc:'15px', code:'13px', small:'12px', sidebar:'14px', tab:'13px' },
    large: { base:'17px', mono:'16px', title:'30px', desc:'17px', code:'15px', small:'13px', sidebar:'15px', tab:'14px' },
  };
  const s = sizes[level] || sizes.medium;
  const root = document.documentElement;
  root.style.setProperty('--fs-base', s.base);
  root.style.setProperty('--fs-mono', s.mono);
  root.style.setProperty('--fs-title', s.title);
  root.style.setProperty('--fs-desc', s.desc);
  root.style.setProperty('--fs-code', s.code);
  root.style.setProperty('--fs-small', s.small);
  root.style.setProperty('--fs-sidebar', s.sidebar);
  root.style.setProperty('--fs-tab', s.tab);
  if (editor) editor.updateOptions({ fontSize: parseInt(s.mono) });
  
  document.querySelectorAll('.font-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.size === level);
  });
  localStorage.setItem('go-font-size', level);
}

function loadPreferences() {
  const savedSize = localStorage.getItem('go-font-size') || 'medium';
  const savedTheme = localStorage.getItem('go-theme') || 'light';
  if (savedTheme === 'light') document.body.classList.add('light');
  if (savedSize !== 'medium') setFontSize(savedSize);
  else document.querySelector('.font-btn[data-size="medium"]')?.classList.add('active');
}

function setupKeyboardShortcut() {
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      if (currentTab === 'exercise' && currentExerciseIndex >= 0) {
        submitExercise();
      } else {
        runCode();
      }
    }
  });
}

function setupMenuToggle() {
  document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
}

// ==================== 启动 ====================
function boot() {
  init();
}

function showError(msg) {
  hideLoading();
}

if (document.readyState === 'complete') {
  boot();
} else {
  window.addEventListener('load', boot);
}

</script>
</body>
</html>
