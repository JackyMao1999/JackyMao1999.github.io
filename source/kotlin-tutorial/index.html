<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kotlin 快速入门教程 - 学练一体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1419;--surface:#1a2332;--border:#2d3b4f;--text:#e6edf3;--text-dim:#8b949e;--primary:#58a6ff;--primary-hover:#79c0ff;--success:#3fb950;--success-bg:rgba(63,185,80,.12);--error:#f85149;--error-bg:rgba(248,81,73,.12);--warning:#d29922;--sidebar-w:280px;--header-h:56px;--fs-base:15px;--fs-mono:13px;--fs-title:26px;--fs-desc:15px;--fs-code:13px;--fs-small:12px;--fs-sidebar:14px;--fs-tab:13px}
body.light{--bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--text:#1f2328;--text-dim:#656d76;--primary:#0969da;--primary-hover:#0550ae;--success:#1a7f37;--success-bg:rgba(26,127,55,.12);--error:#cf222e;--error-bg:rgba(207,34,46,.12);--warning:#9a6700}
body.light #sidebar .section:hover{background:rgba(0,0,0,.03)}
body.light #section-desc pre{background:#f6f8fa}
body.light .exercise-hint{background:rgba(154,103,0,.08);border-color:rgba(154,103,0,.2)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji";background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
a{color:var(--primary);text-decoration:none}
header{height:var(--header-h);display:flex;align-items:center;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100}
header h1{font-size:18px;font-weight:600;flex:1}
header .version{font-size:12px;color:var(--text-dim);background:var(--border);padding:2px 10px;border-radius:4px;flex-shrink:0}
#menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;margin-right:8px}
#theme-toggle{background:none;border:none;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:4px;margin-right:8px;transition:background .15s;line-height:1;flex-shrink:0}
#theme-toggle:hover{background:rgba(255,255,255,.08)}
body.light #theme-toggle:hover{background:rgba(0,0,0,.06)}
#theme-toggle::before{content:'\2601'}
body.light #theme-toggle::before{content:'\2600'}
#font-controls{display:flex;gap:2px;margin-right:12px;align-items:center;flex-shrink:0}
#font-controls .font-btn{background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;padding:2px 7px;border-radius:3px;font-size:12px;transition:all .15s;line-height:1.4;font-family:inherit}
#font-controls .font-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
body.light #font-controls .font-btn:hover{background:rgba(0,0,0,.06)}
#font-controls .font-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
#font-controls .font-btn[data-size="small"]{font-size:10px}
#font-controls .font-btn[data-size="medium"]{font-size:12px}
#font-controls .font-btn[data-size="large"]{font-size:14px}
#app{display:flex;height:calc(100vh - var(--header-h));margin-top:var(--header-h)}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
#sidebar .section{display:block;padding:10px 20px;cursor:pointer;font-size:var(--fs-sidebar);color:var(--text-dim);border-left:3px solid transparent;transition:all .15s;text-decoration:none}
#sidebar .section:hover{color:var(--text);background:rgba(255,255,255,.04)}
#sidebar .section.active{color:var(--primary);border-left-color:var(--primary);background:rgba(88,166,255,.08)}
#sidebar .section .num{display:inline-block;width:20px;font-size:12px;color:var(--text-dim);margin-right:6px}
#sidebar .section.active .num{color:var(--primary)}
#sidebar .divider{height:1px;background:var(--border);margin:8px 12px}
#sidebar .section .done{float:right;font-size:11px;color:var(--success)}
#content{flex:1;min-width:0;overflow-y:auto;padding:28px 36px}
#section-title{font-size:var(--fs-title);font-weight:700;margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid var(--primary);display:inline-block}
#section-progress{font-size:var(--fs-small);color:var(--text-dim);margin-bottom:16px}
.section-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
.section-tab{padding:8px 18px;cursor:pointer;font-size:var(--fs-tab);color:var(--text-dim);border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;transition:all .15s;background:transparent;white-space:nowrap}
.section-tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.section-tab.active{color:var(--primary);background:var(--surface);border-color:var(--border);position:relative}
.section-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--surface)}
.section-tab .check{display:none;margin-left:5px;font-size:11px}
.section-tab.done .check{display:inline;color:var(--success)}
#section-desc{font-size:var(--fs-desc);line-height:1.8;color:var(--text-dim);margin-bottom:20px;max-width:860px}
#section-desc h4{color:var(--text);font-size:16px;margin:18px 0 8px}
#section-desc p{margin:8px 0}
#section-desc code{background:var(--border);padding:2px 6px;border-radius:3px;font-size:13px;color:var(--primary)}
#section-desc strong{color:var(--text)}
#section-desc ul{margin:8px 0;padding-left:22px}
#section-desc li{margin:5px 0}
#section-desc pre{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin:10px 0;overflow-x:auto;font-size:13px;line-height:1.5;font-family:"SF Mono","Fira Code",monospace}
#section-desc pre code{background:none;padding:0;color:var(--text);font-size:inherit}
#exercise-area{display:none;margin-bottom:16px}
#exercise-area.show{display:block}
#exercise-title{font-size:16px;font-weight:600;color:var(--primary);margin-bottom:8px}
#exercise-desc{font-size:var(--fs-desc);line-height:1.7;color:var(--text-dim);margin-bottom:10px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
#exercise-desc code{background:var(--border);padding:1px 5px;border-radius:3px;font-size:13px;color:var(--primary)}
#exercise-hint{display:none;font-size:13px;color:var(--warning);margin-bottom:10px;padding:10px 14px;background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.25);border-radius:6px}
#exercise-hint.show{display:block}
#exercise-hint code{background:rgba(210,153,34,.15);padding:1px 5px;border-radius:3px}
.toggle-hint{background:none;border:none;color:var(--warning);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.toggle-hint:hover{color:var(--primary-hover)}
#editor-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
#editor-container{height:380px}
#editor-container.loading{display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px}
#controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#controls button{display:flex;align-items:center;gap:5px;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:var(--fs-small);font-weight:500;transition:all .15s}
#controls button:disabled{opacity:.4;cursor:not-allowed}
#run-btn{background:var(--success);color:#fff}
#run-btn:hover:not(:disabled){filter:brightness(1.15)}
#run-btn.running{opacity:.7;pointer-events:none}
#reset-btn{background:var(--border);color:var(--text)}
#reset-btn:hover:not(:disabled){background:var(--text-dim);color:var(--bg)}
#submit-btn{background:var(--primary);color:#fff;display:none}
#submit-btn:hover:not(:disabled){background:var(--primary-hover)}
#submit-btn.show{display:flex}
#hint-btn{background:transparent;color:var(--warning);border:1px solid var(--warning)!important;display:none}
#hint-btn.show{display:flex}
#hint-btn:hover{background:rgba(210,153,34,.1)}
#back-btn{background:var(--border);color:var(--text-dim);display:none;font-size:12px}
#back-btn.show{display:flex}
#back-btn:hover{color:var(--text)}
#controls button svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
#output{display:none;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
#output.show{display:block}
#output-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:var(--fs-small);color:var(--text-dim)}
#output-header .badge{font-size:11px;padding:2px 8px;border-radius:3px}
#output-header .badge.success{background:var(--success-bg);color:var(--success)}
#output-header .badge.error{background:var(--error-bg);color:var(--error)}
#output-content{padding:16px;font-family:"SF Mono","Fira Code","Cascadia Code",monospace;font-size:var(--fs-mono);line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:50px;max-height:350px;overflow-y:auto;background:var(--bg);color:var(--text);margin:0}
#output-content .out-log{color:var(--text)}
#output-content .out-err{color:var(--error)}
#output-content .out-info{color:var(--text-dim);font-style:italic}
.result-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;margin:4px 0;border-radius:4px;font-size:var(--fs-mono);line-height:1.5}
.result-item.pass{background:var(--success-bg)}
.result-item.fail{background:var(--error-bg)}
.result-item .icon{font-size:16px;flex-shrink:0;margin-top:1px}
.result-item .icon.pass{color:var(--success)}
.result-item .icon.fail{color:var(--error)}
.result-item .detail{flex:1}
.result-item .detail .args{color:var(--text-dim);font-size:12px}
.result-item .detail .got{color:var(--error);font-size:12px}
.result-item .detail .expected{color:var(--success);font-size:12px}
.result-summary{font-size:15px;font-weight:600;padding:10px 0 4px}
.result-summary.all-pass{color:var(--success)}
.result-summary.has-fail{color:var(--error)}
#sidebar::-webkit-scrollbar,#content::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-track,#content::-webkit-scrollbar-track{background:transparent}
#sidebar::-webkit-scrollbar-thumb,#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#loading-overlay.hide{opacity:0;pointer-events:none}
#loading-overlay .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-overlay .text{color:var(--text-dim);font-size:14px}
@media(max-width:820px){
  #sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .25s;width:260px;min-width:260px}
  #sidebar.open{transform:translateX(0)}
  #menu-toggle{display:block}
  #content{padding:20px 14px}
  #editor-container{height:260px}
  #section-title{font-size:calc(var(--fs-title) - 4px)}
  #section-desc{font-size:calc(var(--fs-desc) - 1px)}
  #controls button{padding:7px 12px}
  .section-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:0}
  .section-tab{padding:7px 12px}
  #font-controls{display:none}
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="text">正在加载 Kotlin 教程 ...</div>
</div>

<header>
  <button id="menu-toggle" aria-label="菜单">&#9776;</button>
  <button id="theme-toggle" aria-label="切换主题" title="切换暗色/淡色主题"></button>
  <h1>Kotlin 快速入门教程</h1>
  <div id="font-controls">
    <button class="font-btn" data-size="small" title="小字号">A</button>
    <button class="font-btn active" data-size="medium" title="中字号（默认）">A</button>
    <button class="font-btn" data-size="large" title="大字号">A</button>
  </div>
  <span class="version">v1.9</span>
</header>

<div id="app">
  <nav id="sidebar"></nav>

  <main id="content">
    <h2 id="section-title"></h2>
    <div id="section-progress"></div>

    <div class="section-tabs" id="section-tabs"></div>

    <div id="section-desc"></div>

    <div id="exercise-area">
      <div id="exercise-title"></div>
      <div id="exercise-desc"></div>
      <div id="exercise-hint"></div>
    </div>

    <div id="editor-wrap">
      <div id="editor-container" class="loading">加载编辑器中...</div>
    </div>

    <div id="controls">
      <button id="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        返回学习
      </button>
      <button id="run-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        运行代码
      </button>
      <button id="submit-btn">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        提交答案
      </button>
      <button id="hint-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        查看提示
      </button>
      <button id="reset-btn">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        重置代码
      </button>
    </div>

    <div id="output">
      <div id="output-header">
        <span>输出结果</span>
        <span id="output-status"></span>
      </div>
      <pre id="output-content"></pre>
    </div>
  </main>
</div>

<script>
// ==================== 教程章节数据 ====================
const SECTIONS = [
  {
    "id":"intro","icon":"🔳","title":"Kotlin 简介","desc":"<p>Kotlin 是由 JetBrains 公司于 2011 年开发的<strong>现代静态类型编程语言</strong>，运行在 JVM（Java 虚拟机）之上。2017 年 Google 宣布 Kotlin 成为 Android 官方开发语言，2019 年更成为 Android 开发的首选语言。Kotlin 的设计目标是<strong>更简洁、更安全、更互操作</strong>——你可以在同一个项目中混合使用 Kotlin 和 Java 代码，两者完美兼容、无缝调用。</p><svg viewBox=\"0 0 640 330\" style=\"max-width:100%;height:auto;margin:14px 0;border-radius:10px;background:#1a2332\"><defs><marker id=\"ja\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#58a6ff\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"640\" height=\"330\" rx=\"8\" fill=\"#0f1419\"/><text x=\"320\" y=\"30\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"15\" font-weight=\"bold\">Kotlin / JVM 架构图</text><rect x=\"30\" y=\"45\" width=\"580\" height=\"48\" rx=\"6\" fill=\"#1a2332\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><text x=\"320\" y=\"63\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"13\" font-weight=\"bold\">Kotlin 源文件 (*.kt)</text><text x=\"320\" y=\"81\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">kotlinc 编译器 → 语法分析 → 语义分析 → 字节码生成</text><line x1=\"320\" y1=\"93\" x2=\"320\" y2=\"108\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#ja)\"/><rect x=\"30\" y=\"108\" width=\"580\" height=\"32\" rx=\"6\" fill=\"#1a2332\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"320\" y=\"129\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"14\" font-weight=\"bold\">JVM 字节码 (*.class) — 与 Java 字节码完全兼容</text><line x1=\"320\" y1=\"140\" x2=\"320\" y2=\"155\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#ja)\"/><text x=\"320\" y=\"172\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"13\" font-weight=\"bold\">JVM 运行时数据区</text><rect x=\"30\" y=\"180\" width=\"130\" height=\"40\" rx=\"4\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"95\" y=\"205\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"11\">方法区</text><rect x=\"175\" y=\"180\" width=\"130\" height=\"40\" rx=\"4\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"240\" y=\"205\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"11\">堆</text><rect x=\"320\" y=\"180\" width=\"130\" height=\"40\" rx=\"4\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"385\" y=\"205\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"11\">虚拟机栈</text><rect x=\"465\" y=\"180\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"510\" y=\"205\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"11\">PC 寄存器</text><rect x=\"565\" y=\"180\" width=\"50\" height=\"40\" rx=\"4\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"590\" y=\"205\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"9\">本地<br/>栈</text><line x1=\"320\" y1=\"220\" x2=\"320\" y2=\"238\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#ja)\"/><rect x=\"30\" y=\"238\" width=\"580\" height=\"38\" rx=\"6\" fill=\"#1a2332\" stroke=\"#f85149\" stroke-width=\"1.5\"/><text x=\"320\" y=\"257\" text-anchor=\"middle\" fill=\"#f85149\" font-size=\"13\" font-weight=\"bold\">执行引擎：解释器 | JIT 编译器 | 垃圾回收器 (GC)</text><line x1=\"320\" y1=\"276\" x2=\"320\" y2=\"292\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#ja)\"/><rect x=\"30\" y=\"292\" width=\"580\" height=\"30\" rx=\"6\" fill=\"#1a2332\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><text x=\"320\" y=\"312\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"12\" font-weight=\"bold\">操作系统 (Linux / Windows / macOS) + 硬件</text></svg><h4>Kotlin 的核心特性</h4><ul><li><strong>空安全</strong>：通过类型系统在<strong>编译期</strong>消除空指针异常（NPE），?.、?:、!! 等运算符让你优雅地处理 null</li><li><strong>扩展函数</strong>：无需继承即可为已有类添加新方法</li><li><strong>数据类</strong>：一行 data class 自动生成 toString、equals、hashCode、copy 方法</li><li><strong>函数式编程</strong>：Lambda 表达式、高阶函数、集合操作符（filter、map、reduce）让代码更声明式</li><li><strong>协程</strong>：轻量级线程，用同步的方式写异步代码，极大简化并发编程</li><li><strong>智能类型转换</strong>：类型检查后自动转换，无需显式强制转型</li></ul><h4>Kotlin 应用场景</h4><p>Android 开发、后端服务（Spring Boot / Ktor）、多平台项目（KMP，一套代码跨 iOS/Android/Web）、数据科学、Gradle 脚本等。Kotlin 的生态正在快速扩展，已成为 JVM 生态中不可忽视的重要力量。</p><h4>第一个程序解析</h4><p>每个 Kotlin 程序的入口是 <code>fun main()</code> 函数。<code>println()</code> 用于输出文本到控制台。<code>val</code> 声明只读变量（不可重新赋值），<code>var</code> 声明可变变量。<code>$name</code> 是<strong>字符串模板</strong>语法，可以将变量的值嵌入到字符串中。</p>","code":"fun main() {\n    println(\"Hello, World!\")\n    val language = \"Kotlin\"\n    val year = 2011\n    println(\"$language was created in $year\")\n    val sum = 1 + 2 + 3 + 4 + 5\n    println(\"Sum = $sum\")\n    println(\"Version: ${sum + 1}\")\n}",
    "exercises":[
      {
          "id":"kt-i1","title":"你好，世界！","desc":"编写程序，读入用户名字并打印问候语。","hint":"使用 readln() 读取输入，println() 输出，字符串模板 $name 嵌入变量。","starterCode":"fun main() {\n    val name = readln()\n    println(\"你好, $name!\")\n}","solution":"fun main() {\n    val name = readln()\n    println(\"你好, $name!\")\n}","fn":"","tests":[]
        },
      {
          "id":"kt-i2","title":"字符串模板","desc":"使用字符串模板计算并打印表达式结果。","hint":"使用 ${a + b} 在字符串中嵌入表达式。","starterCode":"fun main() {\n    val a = 15\n    val b = 27\n    println(\"$a + $b = ${a + b}\")\n}","solution":"fun main() {\n    val a = 15\n    val b = 27\n    println(\"$a + $b = ${a + b}\")\n}","fn":"","tests":[]

  {
    "id":"types","icon":"🔤","title":"类型与变量","desc":"<p>Kotlin 是<strong>静态类型语言</strong>——每个变量的类型在编译时就已确定。但 Kotlin 提供了强大的<strong>类型推导</strong>能力，你可以在大多数情况下省略类型声明，代码既简洁又安全。</p><h4>val 和 var</h4><p><code>val</code>（value）声明<strong>只读引用</strong>，初始化后不可重新赋值（类似于 Java 的 final）。<code>var</code>（variable）声明<strong>可变引用</strong>，可以多次赋值。编程原则：能用 val 就不用 var，尽可能使用不可变性来减少程序的状态复杂性。</p><h4>基本数据类型</h4><ul><li><strong>数字</strong>：<code>Int</code>（32位整数）、<code>Long</code>（64位，用 L 后缀）、<code>Double</code>（64位浮点）、<code>Float</code>（32位，用 f 后缀）</li><li><strong>布尔</strong>：<code>Boolean</code>，值 <code>true</code> / <code>false</code></li><li><strong>字符</strong>：<code>Char</code>，单引号 <code>'A'</code></li><li><strong>字符串</strong>：<code>String</code>，双引号 <code>\"Hello\"</code>，支持字符串模板 <code>\"值 = $value\"</code></li></ul><h4>类型转换</h4><p>Kotlin 没有隐式类型转换，必须显式调用转换方法：<code>toInt()</code>、<code>toDouble()</code>、<code>toString()</code>、<code>toLong()</code> 等。例如：<code>val x: Int = \"42\".toInt()</code>。这样可以避免许多隐式转换带来的隐藏错误。</p><h4>类型检测与智能转换</h4><p>使用 <code>is</code> 运算符检测变量的类型，一旦类型检查通过，Kotlin 会自动将变量转换为检测到的类型——这称为<strong>智能类型转换</strong>（Smart Cast）。例如：<code>if (obj is String) println(obj.length)</code>，在条件分支内 obj 自动变为 String 类型。</p><h4>可空类型</h4><p>任何类型加上 <code>?</code> 后缀就变成了可空类型：<code>String?</code>。可空类型不能直接调用方法，必须通过安全调用 <code>?.</code> 或 Elvis 操作符 <code>?:</code> 来处理 null 情况。。比如，<code>val x = 10L</code> 自动推导为 Long 类型，<code>val y = 3.14f</code> 自动推导为 Float。字符串模板中可以嵌入任意表达式：<code>\"和为 ${a + b}\"</code>。这些语法糖让代码更简洁、更易读。</p><h4></p>","code":"fun main() {\n    val a = 42\n    var b = 3.14\n    val s = \"Kotlin\"\n    val flag = true\n    println(\"Int: $a, Double: $b, String: $s, Boolean: $flag\")\n    val fromStr = \"100\".toInt()\n    val fromInt = 3.14159.toString()\n    println(\"Parse: $fromStr, ToString: $fromInt\")\n    var nullable: String? = \"not null\"\n    println(nullable?.length)\n    nullable = null\n    println(nullable?.length ?: -1)\n    b = 2.718\n    println(\"Pi ~ $b\")\n}",

    "id":"control","icon":"🔀","title":"控制流","desc":"<p>控制流是编程语言的<strong>骨架</strong>，它决定了程序的执行路径。Kotlin 的控制流既有传统的 if、for、while，也有它独有的强大特性<strong>when 表达式</strong>。</p><h4>if 表达式</h4><p>Kotlin 的 if 是<strong>表达式</strong>（有返回值）而不是语句——这是与 Java 最大的不同之一。你可以写：<code>val max = if (a > b) a else b</code>。三元运算符 <code>? :</code> 在 Kotlin 中不存在，直接用 if 表达式替代。</p><h4>when 表达式</h4><svg viewBox=\"0 0 600 320\" style=\"max-width:100%;height:auto;margin:14px 0;border-radius:10px;background:#1a2332\"><defs><marker id=\"wa\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#58a6ff\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"600\" height=\"320\" rx=\"8\" fill=\"#0f1419\"/><text x=\"300\" y=\"30\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"15\" font-weight=\"bold\">when 表达式分支流程图</text><ellipse cx=\"300\" cy=\"62\" rx=\"80\" ry=\"22\" fill=\"#1a2332\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><text x=\"300\" y=\"66\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"13\" font-weight=\"bold\">when (value)</text><line x1=\"300\" y1=\"84\" x2=\"300\" y2=\"100\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#wa)\"/><line x1=\"300\" y1=\"100\" x2=\"140\" y2=\"130\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"100\" x2=\"300\" y2=\"130\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"100\" x2=\"460\" y2=\"130\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><rect x=\"55\" y=\"130\" width=\"170\" height=\"44\" rx=\"6\" fill=\"#1a2332\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"140\" y=\"148\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"12\" font-weight=\"bold\">1 → println(\"one\")</text><text x=\"140\" y=\"164\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">值匹配</text><rect x=\"215\" y=\"130\" width=\"170\" height=\"44\" rx=\"6\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1.5\"/><text x=\"300\" y=\"148\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"12\" font-weight=\"bold\">in 2..5 → println(\"2-5\")</text><text x=\"300\" y=\"164\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">范围匹配</text><rect x=\"375\" y=\"130\" width=\"170\" height=\"44\" rx=\"6\" fill=\"#1a2332\" stroke=\"#f85149\" stroke-width=\"1.5\"/><text x=\"460\" y=\"148\" text-anchor=\"middle\" fill=\"#f85149\" font-size=\"12\" font-weight=\"bold\">else → println(\"other\")</text><text x=\"460\" y=\"164\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">默认分支</text><line x1=\"140\" y1=\"174\" x2=\"140\" y2=\"200\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"174\" x2=\"300\" y2=\"200\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"460\" y1=\"174\" x2=\"460\" y2=\"200\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"140\" y1=\"200\" x2=\"460\" y2=\"200\" stroke=\"#8b949e\" stroke-width=\"1\"/><line x1=\"300\" y1=\"200\" x2=\"300\" y2=\"220\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#wa)\"/><rect x=\"130\" y=\"222\" width=\"340\" height=\"44\" rx=\"8\" fill=\"#1a2332\" stroke=\"#58a6ff\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/><text x=\"300\" y=\"242\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"12\" font-weight=\"bold\">when 可作为表达式返回值：</text><text x=\"300\" y=\"258\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">val result = when (x) { 1 -> \"one\" else -> \"other\" }</text><line x1=\"300\" y1=\"266\" x2=\"300\" y2=\"285\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#wa)\"/><rect x=\"100\" y=\"286\" width=\"400\" height=\"26\" rx=\"6\" fill=\"#1a2332\" stroke=\"#3fb950\" stroke-width=\"1\"/><text x=\"300\" y=\"303\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\">优点：无需 break、支持任意类型、穷尽检查</text></svg><p>when 是 Kotlin 对 Java switch 的<strong>全方位升级</strong>。它不仅支持任意类型的分支条件，还支持范围匹配 <code>in 1..10</code>、类型匹配 <code>is String</code>、甚至任意布尔表达式。最重要的是，when 也是表达式——可以返回一个值。没有 break 穿透问题。</p><h4>for 循环</h4><p><code>for</code> 用于遍历任何可迭代对象：<code>for (i in 1..10)</code> 遍历范围、<code>for (item in list)</code> 遍历集合、<code>for ((index, value) in list.withIndex())</code> 同时获取索引和值。还可以使用 <code>downTo</code>、<code>step</code> 控制步进方向：<code>for (i in 10 downTo 1 step 2)</code>。</p><h4>while 循环</h4><p><code>while</code> 和 <code>do-while</code> 与 Java 类似。<code>break</code> 跳出循环，<code>continue</code> 跳过当前迭代。Kotlin 支持<strong>标签</strong>（label）来 break 到指定外层循环：<code>outer@ for (...) { for (...) { break@outer } }</code>。</p>","code":"fun main() {\n    println(\"=== when 表达式 ===\")\n    val x = 3\n    val desc = when (x) {\n        1 -> \"one\"\n        2 -> \"two\"\n        in 3..5 -> \"three to five\"\n        else -> \"other\"\n    }\n    println(\"$x is $desc\")\n    println(\"\\n=== for 循环 ===\")\n    for (i in 1..5) {\n        val msg = if (i % 2 == 0) \"even\" else \"odd\"\n        println(\"$i is $msg\")\n    }\n    println(\"\\n=== while 循环 ===\")\n    var count = 3\n    while (count > 0) {\n        println(\"Countdown: $count\")\n        count--\n    }\n    println(\"\\n=== 标签 break ===\")\n    outer@ for (i in 1..3) {\n        for (j in 1..3) {\n            if (i * j > 3) break@outer\n            println(\"($i, $j)\")\n        }\n    }\n}",

  {
    "id":"function","icon":"🧩","title":"函数与 Lambda","desc":"<p>函数是 Kotlin 中的<strong>一等公民</strong>——你可以把函数作为参数传递、作为返回值返回、存储在变量中。Kotlin 的函数设计融合了面向对象和函数式编程的优点。</p><h4>函数定义</h4><p>使用 <code>fun</code> 关键字定义函数。如果函数体只有单个表达式，可以简化为<strong>单表达式函数</strong>：<code>fun add(a: Int, b: Int) = a + b</code>。返回值类型可以省略。</p><h4>参数特性</h4><ul><li><strong>默认参数</strong>：<code>fun greet(name: String = \"World\")</code></li><li><strong>具名参数</strong>：<code>greet(name = \"Kotlin\")</code></li><li><strong>可变参数</strong>：<code>fun sum(vararg nums: Int): Int</code></li></ul><h4>Lambda 表达式</h4><p>Lambda 是<strong>匿名函数</strong>的简洁写法，语法：<code>{ 参数 -> 函数体 }</code>。单个参数可用隐含名称 <code>it</code> 代替，例如 <code>list.filter { it > 0 }</code>。Lambda 可以存储在变量中：<code>val square = { x: Int -> x * x }</code>。</p><h4>高阶函数与内联</h4><p><strong>高阶函数</strong>是以函数为参数或返回值的函数。如果 Lambda 是最后一个参数，可以写在括号外，这称为<strong>尾 Lambda 语法</strong>。使用 <code>inline</code> 关键字可以消除 Lambda 创建的匿名类开销，同时支持非局部返回（<code>return</code> 跳出外层函数）。。Kotlin 标准库中有大量实用的高阶函数，比如 <code>filter</code> 用于过滤元素，<code>map</code> 用于转换元素，<code>reduce</code> 用于归约，<code>forEach</code> 用于遍历。这些函数可以链式调用，形成声明式的数据处理链：<code>list.filter { it > 0 }.map { it * 2 }.sum()</code>。。学习 Lambda 和高阶函数是掌握 Kotlin 函数式编程的关键，它们让你的代码更简洁、更易于维护。在实际开发中，高阶函数和 Lambda 的组合是 Kotlin 最强大的编程风格之一。</p><h4>这种风格让你可以用声明式的方式处理数据，减少了循环和临时变量的使用，代码更简洁、更少 bug。</p><h4></p><h4></p>","code":"fun main() {\n    println(\"=== 函数 ===\")\n    println(\"add(3, 5) = ${add(3, 5)}\")\n    println(\"greet() = ${greet()}\")\n    println(\"greet(Kotlin) = ${greet(\"Kotlin\")}\")\n    println(\"\\n=== Lambda ===\")\n    val nums = listOf(1, 2, 3, 4, 5, 6)\n    val evens = nums.filter { it % 2 == 0 }\n    val doubled = nums.map { it * it }\n    val sum = nums.reduce { a, b -> a + b }\n    println(\"Evens: $evens\")\n    println(\"Squares: $doubled\")\n    println(\"Sum: $sum\")\n    println(\"\\n=== 高阶函数 ===\")\n    println(\"operate(10, 5, +) = ${operate(10, 5) { a, b -> a + b }}\")\n    println(\"operate(10, 5, -) = ${operate(10, 5) { a, b -> a - b }}\")\n    println(\"operate(10, 5, *) = ${operate(10, 5) { a, b -> a * b }}\")\n}\nfun add(a: Int, b: Int) = a + b\nfun greet(name: String = \"World\") = \"Hello, $name\"\nfun operate(a: Int, b: Int, op: (Int, Int) -> Int): Int = op(a, b)",

  {
    "id":"class","icon":"🏗️","title":"类与对象","desc":"<p>Kotlin 的类设计追求<strong>简洁与表达力</strong>，将很多 Java 中的模板代码（getter/setter、构造函数、equals/hashCode）简化到了极致。</p><h4>类声明与主构造函数</h4><p>类可以有一个<strong>主构造函数</strong>，直接在类名后声明：<code>class Rectangle(val w: Int, val h: Int)</code>。<code>val</code> 表示同时声明属性和 getter，<code>var</code> 表示同时声明属性、getter 和 setter。使用 <code>init</code> 代码块执行初始化逻辑。</p><h4>数据类</h4><p><code>data class</code> 是 Kotlin 最受欢迎的特性之一。一行代码自动生成：<code>toString()</code>、<code>equals()</code> 和 <code>hashCode()</code>、<code>copy()</code>、<code>componentN()</code>（解构声明）。数据类必须至少有一个主构造函数参数。</p><h4>对象与伴生对象</h4><p><code>object</code> 关键字用于创建<strong>单例</strong>。类内部的 <code>companion object</code>（伴生对象）替代了 Java 的 static 成员，本质上是类内部的一个单例对象，可以有名字、实现接口、被继承。</p><h4>继承与接口</h4><p>Kotlin 的类默认是 <code>final</code> 的——必须使用 <code>open</code> 才能被继承。<code>override</code> 不能省略。接口可以包含<strong>默认实现</strong>。Kotlin 支持<strong>委托模式</strong>：通过 <code>by</code> 关键字将接口实现委托给类的属性。</p><h4>密封类</h4><p><code>sealed class</code> 的所有子类必须在同一文件中定义，when 处理时不需要 else 分支（编译器可以穷尽检查），非常适合表示有限状态。。Kotlin 的属性可以自定义 getter 和 setter，例如 <code>var name: String get() = field.uppercase() set(value) { field = value }</code>。<code>field</code> 是背景字段（backing field），用于在 getter/setter 中访问实际存储的值。这种设计既\b security又灵活。】Kotlin 的类系统既安全又灵活，是一个值得深入学习的重要特性。</p><h4></p><h4></p>","code":"fun main() {\n    val r = Rectangle(5.0, 3.0)\n    println(\"Rectangle: w=${r.w}, h=${r.h}, area=${r.area()}\")\n    val u1 = User(\"Alice\", 30)\n    val u2 = User(\"Bob\", 25)\n    println(\"\\nUser1: $u1\")\n    println(\"User2: $u2\")\n    println(\"Same?: ${u1 == u2}\")\n    val u3 = u1.copy(age = 31)\n    println(\"\\nCopied: $u3\")\n    println(\"\\nCounter: ${Counter.count()}\")\n    println(\"Counter: ${Counter.count()}\")\n}\nclass Rectangle(val w: Double, val h: Double) {\n    fun area() = w * h\n}\ndata class User(val name: String, val age: Int)\nobject Counter {\n    private var n = 0\n    fun count(): Int = ++n\n}",

    "id":"nullsafe","icon":"🛡️","title":"空安全","desc":"<p>空指针异常（NullPointerException）是 Java 程序中最常见的运行时错误。Tony Hoare 曾称自己发明 null 引用是\"十亿美元的错误\"。Kotlin 在<strong>类型系统层面</strong>解决了这个问题——让 null 变得显式、可控。</p><svg viewBox=\"0 0 600 310\" style=\"max-width:100%;height:auto;margin:14px 0;border-radius:10px;background:#1a2332\"><defs><marker id=\"na\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#58a6ff\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"600\" height=\"310\" rx=\"8\" fill=\"#0f1419\"/><text x=\"300\" y=\"28\" text-anchor=\"middle\" fill=\"#e6edf3\" font-size=\"15\" font-weight=\"bold\">Kotlin 空安全体系</text><text x=\"300\" y=\"46\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">编译时消除空指针异常 (NPE)</text><line x1=\"300\" y1=\"54\" x2=\"300\" y2=\"64\" stroke=\"#8b949e\" stroke-width=\"1\"/><rect x=\"40\" y=\"66\" width=\"240\" height=\"42\" rx=\"6\" fill=\"#1a2332\" stroke=\"#3fb950\" stroke-width=\"1.5\"/><text x=\"160\" y=\"82\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"13\" font-weight=\"bold\">非空类型 String</text><text x=\"160\" y=\"99\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">var s: String = \"hello\"  ✅ 永远不为 null</text><rect x=\"320\" y=\"66\" width=\"240\" height=\"42\" rx=\"6\" fill=\"#1a2332\" stroke=\"#f85149\" stroke-width=\"1.5\"/><text x=\"440\" y=\"82\" text-anchor=\"middle\" fill=\"#f85149\" font-size=\"13\" font-weight=\"bold\">可空类型 String?</text><text x=\"440\" y=\"99\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">var s: String? = null  ⚠️ 可能为 null</text><line x1=\"160\" y1=\"108\" x2=\"160\" y2=\"130\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#na)\"/><line x1=\"440\" y1=\"108\" x2=\"440\" y2=\"130\" stroke=\"#f85149\" stroke-width=\"1.5\" marker-end=\"url(#na)\"/><rect x=\"40\" y=\"132\" width=\"240\" height=\"52\" rx=\"6\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"160\" y=\"150\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"12\" font-weight=\"bold\">安全调用 ?.</text><text x=\"160\" y=\"167\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">s?.length</text><text x=\"160\" y=\"181\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">s 为 null 时返回 null，不抛异常</text><rect x=\"320\" y=\"132\" width=\"240\" height=\"52\" rx=\"6\" fill=\"#1a2332\" stroke=\"#d29922\" stroke-width=\"1\"/><text x=\"440\" y=\"150\" text-anchor=\"middle\" fill=\"#d29922\" font-size=\"12\" font-weight=\"bold\">Elvis 操作符 ?:</text><text x=\"440\" y=\"167\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">s?.length ?: 0</text><text x=\"440\" y=\"181\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">null 时返回默认值 0</text><line x1=\"160\" y1=\"184\" x2=\"160\" y2=\"200\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><line x1=\"440\" y1=\"184\" x2=\"440\" y2=\"200\" stroke=\"#8b949e\" stroke-width=\"1.5\"/><rect x=\"40\" y=\"202\" width=\"520\" height=\"46\" rx=\"6\" fill=\"#1a2332\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><text x=\"300\" y=\"220\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"13\" font-weight=\"bold\">let 安全调用链</text><text x=\"300\" y=\"238\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">s?.let { println(it.length) }  → 仅在非 null 时执行</text><line x1=\"300\" y1=\"248\" x2=\"300\" y2=\"262\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#na)\"/><rect x=\"80\" y=\"264\" width=\"440\" height=\"38\" rx=\"8\" fill=\"#1a2332\" stroke=\"#f85149\" stroke-width=\"1\"/><text x=\"300\" y=\"280\" text-anchor=\"middle\" fill=\"#f85149\" font-size=\"11\">非空断言 s!!  →  如果 s 为 null 则抛 NPE（谨慎使用）</text><text x=\"300\" y=\"296\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">Kotlin 通过 ?.  ?:  !!  as?  let 构建完整的空安全体系</text></svg><h4>可空类型与不可空类型</h4><p><code>String</code> 和 <code>String?</code> 是<strong>两种完全不同的类型</strong>。前者永远不能为 null，后者可以。这种区分在编译时就完成，从根源上杜绝了 NPE。</p><h4>安全调用 ?.</h4><p><code>s?.length</code>——s 为 null 时返回 null，否则返回 s.length。可以<strong>链式使用</strong>：<code>user?.address?.city</code>，链中任何一个环节为 null，整个表达式返回 null。</p><h4>Elvis 操作符 ?:</h4><p><code>s?.length ?: 0</code>——左侧为 null 时返回右侧的默认值。Elvis 经常与安全调用配合使用，为 null 提供回退值。名称来源于 Elvis 的发型（? 看起来像他的头发）。</p><h4>非空断言 !!</h4><p><code>s!!</code>——强制认为 s 非 null，否则抛出 NPE。Kotlin 强烈建议避免使用 !! ，而是用更安全的方式。</p><h4>let 与安全调用配合</h4><p><code>s?.let { println(it) }</code>——仅当 s 非 null 时执行。<code>it</code> 在块内已经是<strong>非空类型</strong>，可以直接调用方法。这是 Kotlin 中最常用的 null 处理模式。</p><h4>智能类型转换</h4><p>在 null 检查之后，Kotlin 自动将可空类型转换为非空类型：<code>if (s != null) println(s.length)</code>——在分支内 s 自动变为 String 类型。</p>","code":"fun main() {\n    println(\"=== 空安全 ===\")\n    var s: String? = \"Hello\"\n    println(\"s = \\\"$s\\\", length = ${s?.length}\")\n    s = null\n    println(\"s = null, safe call = ${s?.length}\")\n    println(\"elvis = ${s?.length ?: -1}\")\n    val name: String? = \"Kotlin\"\n    name?.let {\n        println(\"\\nlet block: name = $it, length = ${it.length}\")\n    }\n    val maybe: String? = \"Smart Cast\"\n    if (maybe != null) {\n        println(\"\\nSmart cast: ${maybe.uppercase()}\")\n    }\n    data class Address(val city: String?)\n    data class Person(val addr: Address?)\n    val p = Person(Address(\"Beijing\"))\n    println(\"\\nCity: ${p.addr?.city ?: \"unknown\"}\")\n    println(\"\\nAll done without NPE!\")\n}",

    "id":"collection","icon":"📚","title":"集合操作","desc":"<p>Kotlin 的集合框架在 Java 基础上做了大量增强，提供了<strong>不可变集合</strong>（只读视图）和<strong>丰富的函数式操作符</strong>。</p><h4>集合类型</h4><ul><li><strong>List</strong>：有序、可重复。<code>listOf()</code> / <code>mutableListOf()</code></li><li><strong>Set</strong>：无序、唯一。<code>setOf()</code> / <code>mutableSetOf()</code></li><li><strong>Map</strong>：键值对。<code>mapOf(\"a\" to 1)</code> / <code>mutableMapOf()</code></li></ul><h4>不可变 vs 可变</h4><p>Kotlin 区分<strong>只读引用</strong> List 接口和<strong>可变集合</strong> MutableList。<code>listOf()</code> 返回只读视图，没有 add/remove。只读引用不意味着底层数据不可变——其他引用可能会修改它。</p><h4>常用操作符</h4><ul><li><strong>filter</strong>：按条件过滤</li><li><strong>map</strong>：转换每个元素</li><li><strong>sorted / sortedBy</strong>：排序</li><li><strong>groupBy</strong>：按 key 分组</li><li><strong>partition</strong>：拆分为两个列表</li><li><strong>reduce / fold</strong>：归约聚合</li><li><strong>flatMap</strong>：扁平化映射</li><li><strong>any / all / none</strong>：条件检查</li></ul><h4>Sequence 惰性求值</h4><p>对集合使用 filter、map 等会创建<strong>中间集合</strong>。对于大数据集，使用 <code>asSequence()</code> 将集合转为序列，操作变为惰性求值——每个元素经过完整链处理后再处理下一个，避免中间集合开销。。除了常见的 filter 和 map，Kotlin 还提供了 <code>zip</code>（合并两个集合）、<code>chunked</code>（拆分为定长子列表）、<code>windowed</code>（滑动窗口）、<code>associate</code>（转为 Map）等丰富的操作符。学习这些 API 可以大幅提高你的编程效率。。掌握这些操作符能让你用更少的代码完成更复杂的数据处理任务，这也是 Kotlin 相比 Java 的重大优势之一。熟练运用集合操作符是从 Kotlin 新手到高手的必由之路。</p><h4>举例来说，你可以用一行代码完成“取所有大于零的奇数，按降序排列，取前三个”的复杂操作：<code>list.filter { it > 0 && it % 2 != 0 }.sortedDescending().take(3)</code>。</p><h4></p><h4></p>","code":"fun main() {\n    println(\"=== 集合操作 ===\")\n    val nums = listOf(5, 2, 8, 1, 3, 7, 4, 6)\n    println(\"Original: $nums\")\n    println(\"Sorted: ${nums.sorted()}\")\n    println(\"Reversed: ${nums.reversed()}\")\n    println(\"Filter > 4: ${nums.filter { it > 4 }}\")\n    println(\"Map * 10: ${nums.map { it * 10 }}\")\n    println(\"Sum: ${nums.sum()}\")\n    println(\"Average: ${nums.average()}\")\n    println(\"\\n=== 分组与分区 ===\")\n    val words = listOf(\"apple\", \"banana\", \"avocado\", \"cherry\", \"blueberry\")\n    val grouped = words.groupBy { it.first() }\n    println(\"Grouped by first letter: $grouped\")\n    val (long, short) = words.partition { it.length > 5 }\n    println(\"Long words: $long\")\n    println(\"Short words: $short\")\n    println(\"\\n=== 惰性序列 ===\")\n    val seq = (1..100).asSequence()\n        .filter { it % 10 == 0 }\n        .map { it / 10 }\n        .take(3)\n        .toList()\n    println(\"Sequence result: $seq\")\n}",

th=\"1.2\"/><text x=\"480\" y=\"128\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"bold\">挂起操作 (suspend)</text><text x=\"480\" y=\"144\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">delay() 仅挂起协程，不阻塞线程</text><rect x=\"40\" y=\"156\" width=\"240\" height=\"36\" rx=\"5\" fill=\"#1a2332\" stroke=\"#f85149\" stroke-width=\"1.2\"/><text x=\"160\" y=\"172\" text-anchor=\"middle\" fill=\"#f85149\" font-size=\"11\" font-weight=\"bold\">上下文切换代价高</text><text x=\"160\" y=\"188\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">内核态切换，开销大</text><rect x=\"360\" y=\"156\" width=\"240\" height=\"36\" rx=\"5\" fill=\"#1a2332\" stroke=\"#3fb950\" stroke-width=\"1.2\"/><text x=\"480\" y=\"172\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"bold\">挂起切换代价极低</text><text x=\"480\" y=\"188\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">用户态切换，几乎无开销</text><rect x=\"40\" y=\"200\" width=\"240\" height=\"36\" rx=\"5\" fill=\"#1a2332\" stroke=\"#f85149\" stroke-width=\"1.2\"/><text x=\"160\" y=\"216\" text-anchor=\"middle\" fill=\"#f85149\" font-size=\"11\" font-weight=\"bold\">可创建数量有限</text><text x=\"160\" y=\"232\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">通常几千个</text><rect x=\"360\" y=\"200\" width=\"240\" height=\"36\" rx=\"5\" fill=\"#1a2332\" stroke=\"#3fb950\" stroke-width=\"1.2\"/><text x=\"480\" y=\"216\" text-anchor=\"middle\" fill=\"#3fb950\" font-size=\"11\" font-weight=\"bold\">可创建数十万协程</text><text x=\"480\" y=\"232\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"10\">内存占用仅几 KB</text><rect x=\"100\" y=\"250\" width=\"440\" height=\"40\" rx=\"10\" fill=\"#1a2332\" stroke=\"#58a6ff\" stroke-width=\"1.5\"/><text x=\"320\" y=\"267\" text-anchor=\"middle\" fill=\"#79c0ff\" font-size=\"12\" font-weight=\"bold\">协程 = 轻量级线程 · 结构化并发 · suspend/resume</text><text x=\"320\" y=\"283\" text-anchor=\"middle\" fill=\"#8b949e\" font-size=\"11\">用同步的方式写异步代码，告别回调地狱</text></svg><h4>什么是协程</h4><p>协程是一 // ==================== 工具函数 ====================
function toPythonLiteral(val) {
  if (val === null || val === undefined) return 'None';
  if (typeof val === 'boolean') return val ? 'True' : 'False';
  if (typeof val === 'number') {
    if (Number.isInteger(val) && Math.abs(val) < 1e15) return String(val);
    return String(val);
  }
  if (typeof val === 'string') {
    const escaped = val.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
    return "'" + escaped + "'";
  }
  if (Array.isArray(val)) return '[' + val.map(toPythonLiteral).join(', ') + ']';
  if (typeof val === 'object') {
    const items = Object.entries(val).map(([k, v]) => toPythonLiteral(k) + ': ' + toPythonLiteral(v));
    return '{' + items.join(', ') + '}';
  }
  return String(val);
}

function formatValue(val) {
  if (val === null) return 'None';
  if (val === undefined) return 'None';
  if (typeof val === 'object') {
    try { return JSON.stringify(val, null, 2); }
    catch(e) { return String(val); }
  }
  return String(val);
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 代码缓存 ====================
function cacheKey() {
  if (currentTab === 'learn' || currentExerciseIndex === -1) return 'kotlin-' + currentSectionId;
  return 'kotlin-' + currentSectionId + '-' + currentExerciseIndex;
}

function saveCode() {
  if (!editor) return;
  try { localStorage.setItem(cacheKey(), editor.getValue()); } catch(e) {}
}

function loadCachedCode(fallback) {
  try {
    const cached = localStorage.getItem(cacheKey());
    return cached !== null ? cached : fallback;
  } catch(e) { return fallback; }
}

function clearCachedCode() {
  try { localStorage.removeItem(cacheKey()); } catch(e) {}
}

// ==================== 初始化 ====================
function init() {
  hideLoading();
  loadProgress();
  loadPreferences();
  renderSidebar();
  setupKeyboardShortcut();
  setupMenuToggle();
  setupButtons();
  createEditor();
}

function setupButtons() {
  const runBtn = document.getElementById('run-btn');
  const resetBtn = document.getElementById('reset-btn');
  const submitBtn = document.getElementById('submit-btn');
  const hintBtn = document.getElementById('hint-btn');
  const backBtn = document.getElementById('back-btn');
  if (runBtn) runBtn.addEventListener('click', runCode);
  if (resetBtn) resetBtn.addEventListener('click', resetCode);
  if (submitBtn) submitBtn.addEventListener('click', submitExercise);
  if (hintBtn) hintBtn.addEventListener('click', toggleHint);
  if (backBtn) backBtn.addEventListener('click', goBackToLearn);

  const themeToggle = document.getElementById('theme-toggle');
  if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

  document.querySelectorAll('.font-btn').forEach(btn => {
    btn.addEventListener('click', () => setFontSize(btn.dataset.size));
  });
}

function hideLoading() {
  const el = document.getElementById('loading-overlay');
  if (el) el.classList.add('hide');
}

// ==================== 侧边栏 ====================
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  sidebar.innerHTML = SECTIONS.map((s, i) => {
    const done = exerciseResults[s.id];
    const count = s.exercises ? s.exercises.length : 0;
    const doneCount = done ? Object.keys(done).length : 0;
    const doneMark = count > 0 && doneCount >= count ? ' <span class="done">✓全部</span>' : '';
    return '<a class="section" data-id="' + s.id + '" href="javascript:void(0)">'
      + '<span class="num">' + (i + 1) + '.</span> ' + (s.icon || '') + ' ' + s.title + doneMark
    + '</a>';
  }).join('<div class="divider"></div>');
  sidebar.addEventListener('click', (e) => {
    const el = e.target.closest('.section');
    if (el) {
      const id = el.dataset.id;
      if (id !== currentSectionId) {
        loadSection(id);
        document.getElementById('sidebar').classList.remove('open');
      }
    }
  });
}

function highlightSidebar(id) {
  document.querySelectorAll('#sidebar .section').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ==================== 章节加载 ====================
function loadSection(id) {
  const section = SECTIONS.find(s => s.id === id);
  if (!section) return;
  currentSectionId = id;
  currentTab = 'learn';
  currentExerciseIndex = -1;

  document.getElementById('section-title').textContent = section.title;
  document.getElementById('section-desc').innerHTML = section.desc;
  document.getElementById('content').scrollTop = 0;
  highlightSidebar(id);
  document.getElementById('output').classList.remove('show');

  updateProgress(section);
  renderTabs(section);

  document.getElementById('section-desc').style.display = 'block';
  document.getElementById('exercise-area').classList.remove('show');
  document.getElementById('submit-btn').classList.remove('show');
  document.getElementById('hint-btn').classList.remove('show');
  document.getElementById('back-btn').classList.remove('show');

  if (editor) {
    editor.setValue(section.code);
    
  }
}

function updateProgress(section) {
  const el = document.getElementById('section-progress');
  if (!section.exercises || section.exercises.length === 0) {
    el.textContent = '';
    return;
  }
  const done = exerciseResults[section.id] || {};
  const doneCount = Object.keys(done).length;
  const total = section.exercises.length;
  el.textContent = '练习进度: ' + doneCount + '/' + total + (doneCount >= total ? ' 🎉 全部完成!' : '');
}

// ==================== 标签页 ====================
function renderTabs(section) {
  const tabsEl = document.getElementById('section-tabs');
  let html = '<div class="section-tab active" data-tab="learn">📖 学习</div>';
  if (section.exercises) {
    section.exercises.forEach((ex, i) => {
      const done = exerciseResults[section.id] && exerciseResults[section.id][ex.id];
      html += '<div class="section-tab' + (done ? ' done' : '') + '" data-tab="' + i + '">练习 ' + (i+1) + (done ? '<span class="check">✓</span>' : '') + '</div>';
    });
  }
  tabsEl.innerHTML = html;

  tabsEl.querySelectorAll('.section-tab').forEach(el => {
    el.addEventListener('click', () => {
      const tab = el.dataset.tab;
      if (tab === 'learn') {
        switchToLearn(section);
      } else {
        switchToExercise(section, parseInt(tab));
      }
    });
  });
}

function switchToLearn(section) {
  currentTab = 'learn';
  currentExerciseIndex = -1;

  document.querySelectorAll('#section-tabs .section-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === 'learn');
  });

  document.getElementById('section-desc').style.display = 'block';
  document.getElementById('exercise-area').classList.remove('show');
  document.getElementById('submit-btn').classList.remove('show');
  document.getElementById('hint-btn').classList.remove('show');
  document.getElementById('back-btn').classList.remove('show');
  document.getElementById('output').classList.remove('show');

  if (editor) {
    editor.setValue(loadCachedCode(section.code));
    
  }
}

function switchToExercise(section, index) {
  if (!section.exercises || !section.exercises[index]) return;

  currentTab = 'exercise';
  currentExerciseIndex = index;
  const ex = section.exercises[index];

  document.querySelectorAll('#section-tabs .section-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === String(index));
  });

  document.getElementById('section-desc').style.display = 'none';
  document.getElementById('exercise-area').classList.add('show');
  document.getElementById('exercise-title').textContent = ex.title;
  document.getElementById('exercise-desc').innerHTML = ex.desc;
  document.getElementById('exercise-hint').innerHTML = ex.hint || '';
  document.getElementById('exercise-hint').classList.remove('show');
  document.getElementById('submit-btn').classList.add('show');
  document.getElementById('hint-btn').classList.add('show');
  document.getElementById('back-btn').classList.add('show');
  document.getElementById('output').classList.remove('show');

  if (editor) {
    editor.setValue(loadCachedCode(ex.starterCode));
    
  }
}

function goBackToLearn() {
  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (section) switchToLearn(section);
}

function toggleHint() {
  const hint = document.getElementById('exercise-hint');
  hint.classList.toggle('show');
  document.getElementById('hint-btn').textContent = hint.classList.contains('show') ? '隐藏提示' : '查看提示';
}


async function runCode() {
  if (isRunning || !editor) return;
  const btn = document.getElementById('run-btn');
  btn.classList.add('running');
  isRunning = true;
  const code = editor.getValue();
  const output = document.getElementById('output');
  const outputContent = document.getElementById('output-content');
  const statusEl = document.getElementById('output-status');
  output.classList.add('show');
  outputContent.innerHTML = '<span class="out-info">\u23f3 \u6b63\u5728\u6267\u884c ...</span>';
  try {
    const resp = await fetch('https://emkc.org/api/v2/piston/execute', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ language: 'kotlin', version: '*', files: [{ name: 'main.kt', content: code }] })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.compile && data.compile.stderr) {
      outputContent.innerHTML = '<span class="out-err">\u26d4 ' + escHtml(data.compile.stderr) + '</span>';
      statusEl.innerHTML = '<span class="badge error">\u2717 \u7f16\u8bd1\u5931\u8d25</span>';
    } else if (data.run && data.run.stdout) {
      outputContent.innerHTML = escHtml(data.run.stdout).replace(/\n/g, '<br>');
      statusEl.innerHTML = '<span class="badge success">\u2713 \u6267\u884c\u6210\u529f</span>';
    } else if (data.run && data.run.stderr) {
      outputContent.innerHTML = '<span class="out-err">\u26d4 ' + escHtml(data.run.stderr) + '</span>';
      statusEl.innerHTML = '<span class="badge error">\u2717 \u8fd0\u884c\u65f6\u9519\u8bef</span>';
    } else {
      outputContent.innerHTML = '<span class="out-info">\u2713 \u4ee3\u7801\u5df2\u6267\u884c\uff08\u65e0\u8f93\u51fa\u5185\u5bb9\uff09</span>';
      statusEl.innerHTML = '<span class="badge success">\u2713 \u6267\u884c\u6210\u529f</span>';
    }
  } catch (e) {
    outputContent.innerHTML = '<span class="out-err">\u26d4 ' + escHtml(e.message) + '</span>';
    statusEl.innerHTML = '<span class="badge error">\u2717 \u8bf7\u6c42\u5931\u8d25</span>';
  }
  btn.classList.remove('running');
  isRunning = false;
}

function submitExercise() {
  if (isRunning || !editor) return;
  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (!section || !section.exercises || currentExerciseIndex < 0) return;
  const output = document.getElementById('output');
  const outputContent = document.getElementById('output-content');
  const statusEl = document.getElementById('output-status');
  output.classList.add('show');
  outputContent.innerHTML = '<span class="out-info">\u23f3 \u8bf7\u70b9\u51fb\u201c\u8fd0\u884c\u4ee3\u7801\u201d\u6267\u884c\u540e\u67e5\u770b\u8f93\u51fa\uff0c\u81ea\u884c\u5bf9\u6bd4\u7ed3\u679c\u3002</span>';
  statusEl.innerHTML = '';
}

// ==================== 代码编辑器 ====================
function createEditor() {
  if (editorReady) return;
  editorReady = true;

  const container = document.getElementById('editor-container');
  if (!container) return;
  container.classList.remove('loading');
  container.innerHTML = '<textarea id="editor" style="width:100%;height:100%;background:var(--bg);color:var(--text);border:none;outline:none;resize:none;font-family:\"SF Mono\",\"Fira Code\",\"Cascadia Code\",monospace;font-size:14px;padding:12px;tab-size:4;white-space:pre;overflow-wrap:normal;overflow-x:auto;line-height:1.5"></textarea>';

  const ta = document.getElementById('editor');
  editor = {
    getValue: () => ta.value,
    setValue: (v) => { ta.value = v; },
  };
  const savedTheme = localStorage.getItem('kotlin-theme') || 'light';
  if (savedTheme === 'light') document.body.classList.add('light');

  ta.value = loadCachedCode(SECTIONS[0].code);

  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(en);
      ta.selectionStart = ta.selectionEnd = s + 2;
    }
  });

  let saveTimer;
  ta.addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCode, 500);
  });

  loadSection(currentSectionId);
}


function resetCode() {
  if (!editor) return;
  clearCachedCode();
  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (currentTab === 'learn' || currentExerciseIndex === -1) {
    editor.setValue(section.code);
  } else if (section.exercises && section.exercises[currentExerciseIndex]) {
    editor.setValue(section.exercises[currentExerciseIndex].starterCode);
  }
  document.getElementById('output').classList.remove('show');
}

// ==================== 主题切换 ====================
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('kotlin-theme', isLight ? 'light' : 'dark');
}

function setFontSize(level) {
  const sizes = {
    small: { base:'13px', mono:'12px', title:'22px', desc:'13px', code:'12px', small:'11px', sidebar:'12px', tab:'12px' },
    medium: { base:'15px', mono:'14px', title:'26px', desc:'15px', code:'13px', small:'12px', sidebar:'14px', tab:'13px' },
    large: { base:'17px', mono:'16px', title:'30px', desc:'17px', code:'15px', small:'13px', sidebar:'15px', tab:'14px' },
  };
  const s = sizes[level] || sizes.medium;
  const root = document.documentElement;
  root.style.setProperty('--fs-base', s.base);
  root.style.setProperty('--fs-mono', s.mono);
  root.style.setProperty('--fs-title', s.title);
  root.style.setProperty('--fs-desc', s.desc);
  root.style.setProperty('--fs-code', s.code);
  root.style.setProperty('--fs-small', s.small);
  root.style.setProperty('--fs-sidebar', s.sidebar);
  root.style.setProperty('--fs-tab', s.tab);
  

  document.querySelectorAll('.font-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.size === level);
  });
  localStorage.setItem('kotlin-font-size', level);
}

function loadPreferences() {
  const savedSize = localStorage.getItem('kotlin-font-size') || 'medium';
  const savedTheme = localStorage.getItem('kotlin-theme') || 'light';
  if (savedTheme === 'light') document.body.classList.add('light');
  if (savedSize !== 'medium') setFontSize(savedSize);
  else document.querySelector('.font-btn[data-size="medium"]')?.classList.add('active');
}

function setupKeyboardShortcut() {
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      if (currentTab === 'exercise' && currentExerciseIndex >= 0) {
        submitExercise();
      } else {
        runCode();
      }
    }
  });
}

function setupMenuToggle() {
  document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
}

// ==================== 启动 ====================
function boot() {
  init();
}

function showError(msg) {
  hideLoading();
}

if (document.readyState === 'complete') {
  boot();
} else {
  window.addEventListener('load', boot);
}

</script>
</body>
</html>
