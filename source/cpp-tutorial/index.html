<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ 快速入门教程 - 学练一体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1419;--surface:#1a2332;--border:#2d3b4f;--text:#e6edf3;--text-dim:#8b949e;--primary:#58a6ff;--primary-hover:#79c0ff;--success:#3fb950;--success-bg:rgba(63,185,80,.12);--error:#f85149;--error-bg:rgba(248,81,73,.12);--warning:#d29922;--sidebar-w:280px;--header-h:56px;--fs-base:15px;--fs-mono:13px;--fs-title:26px;--fs-desc:15px;--fs-code:13px;--fs-small:12px;--fs-sidebar:14px;--fs-tab:13px}
body.light{--bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--text:#1f2328;--text-dim:#656d76;--primary:#0969da;--primary-hover:#0550ae;--success:#1a7f37;--success-bg:rgba(26,127,55,.12);--error:#cf222e;--error-bg:rgba(207,34,46,.12);--warning:#9a6700}
body.light #sidebar .section:hover{background:rgba(0,0,0,.03)}
body.light #section-desc pre{background:#f6f8fa}
body.light .exercise-hint{background:rgba(154,103,0,.08);border-color:rgba(154,103,0,.2)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji";background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
a{color:var(--primary);text-decoration:none}
header{height:var(--header-h);display:flex;align-items:center;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100}
header h1{font-size:18px;font-weight:600;flex:1}
header .version{font-size:12px;color:var(--text-dim);background:var(--border);padding:2px 10px;border-radius:4px;flex-shrink:0}
#menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;margin-right:8px}
#theme-toggle{background:none;border:none;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:4px;margin-right:8px;transition:background .15s;line-height:1;flex-shrink:0}
#theme-toggle:hover{background:rgba(255,255,255,.08)}
body.light #theme-toggle:hover{background:rgba(0,0,0,.06)}
#theme-toggle::before{content:'\2601'}
body.light #theme-toggle::before{content:'\2600'}
#font-controls{display:flex;gap:2px;margin-right:12px;align-items:center;flex-shrink:0}
#font-controls .font-btn{background:none;border:1px solid var(--border);color:var(--text-dim);cursor:pointer;padding:2px 7px;border-radius:3px;font-size:12px;transition:all .15s;line-height:1.4;font-family:inherit}
#font-controls .font-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
body.light #font-controls .font-btn:hover{background:rgba(0,0,0,.06)}
#font-controls .font-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
#font-controls .font-btn[data-size="small"]{font-size:10px}
#font-controls .font-btn[data-size="medium"]{font-size:12px}
#font-controls .font-btn[data-size="large"]{font-size:14px}
#app{display:flex;height:calc(100vh - var(--header-h));margin-top:var(--header-h)}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
#sidebar .section{display:block;padding:10px 20px;cursor:pointer;font-size:var(--fs-sidebar);color:var(--text-dim);border-left:3px solid transparent;transition:all .15s;text-decoration:none}
#sidebar .section:hover{color:var(--text);background:rgba(255,255,255,.04)}
#sidebar .section.active{color:var(--primary);border-left-color:var(--primary);background:rgba(88,166,255,.08)}
#sidebar .section .num{display:inline-block;width:20px;font-size:12px;color:var(--text-dim);margin-right:6px}
#sidebar .section.active .num{color:var(--primary)}
#sidebar .divider{height:1px;background:var(--border);margin:8px 12px}
#sidebar .section .done{float:right;font-size:11px;color:var(--success)}
#content{flex:1;min-width:0;overflow-y:auto;padding:28px 36px}
#section-title{font-size:var(--fs-title);font-weight:700;margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid var(--primary);display:inline-block}
#section-progress{font-size:var(--fs-small);color:var(--text-dim);margin-bottom:16px}
.section-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
.section-tab{padding:8px 18px;cursor:pointer;font-size:var(--fs-tab);color:var(--text-dim);border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;transition:all .15s;background:transparent;white-space:nowrap}
.section-tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.section-tab.active{color:var(--primary);background:var(--surface);border-color:var(--border);position:relative}
.section-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--surface)}
.section-tab .check{display:none;margin-left:5px;font-size:11px}
.section-tab.done .check{display:inline;color:var(--success)}
#section-desc{font-size:var(--fs-desc);line-height:1.8;color:var(--text-dim);margin-bottom:20px;max-width:860px}
#section-desc h4{color:var(--text);font-size:16px;margin:18px 0 8px}
#section-desc p{margin:8px 0}
#section-desc code{background:var(--border);padding:2px 6px;border-radius:3px;font-size:13px;color:var(--primary)}
#section-desc strong{color:var(--text)}
#section-desc ul{margin:8px 0;padding-left:22px}
#section-desc li{margin:5px 0}
#section-desc pre{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin:10px 0;overflow-x:auto;font-size:13px;line-height:1.5;font-family:"SF Mono","Fira Code",monospace}
#section-desc pre code{background:none;padding:0;color:var(--text);font-size:inherit}
#exercise-area{display:none;margin-bottom:16px}
#exercise-area.show{display:block}
#exercise-title{font-size:16px;font-weight:600;color:var(--primary);margin-bottom:8px}
#exercise-desc{font-size:var(--fs-desc);line-height:1.7;color:var(--text-dim);margin-bottom:10px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
#exercise-desc code{background:var(--border);padding:1px 5px;border-radius:3px;font-size:13px;color:var(--primary)}
#exercise-hint{display:none;font-size:13px;color:var(--warning);margin-bottom:10px;padding:10px 14px;background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.25);border-radius:6px}
#exercise-hint.show{display:block}
#exercise-hint code{background:rgba(210,153,34,.15);padding:1px 5px;border-radius:3px}
.toggle-hint{background:none;border:none;color:var(--warning);cursor:pointer;font-size:13px;padding:0;text-decoration:underline}
.toggle-hint:hover{color:var(--primary-hover)}
#editor-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
#editor-container{height:380px}
#editor-container.loading{display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px}
#controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#controls button{display:flex;align-items:center;gap:5px;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:var(--fs-small);font-weight:500;transition:all .15s}
#controls button:disabled{opacity:.4;cursor:not-allowed}
#run-btn{background:var(--success);color:#fff}
#run-btn:hover:not(:disabled){filter:brightness(1.15)}
#run-btn.running{opacity:.7;pointer-events:none}
#reset-btn{background:var(--border);color:var(--text)}
#reset-btn:hover:not(:disabled){background:var(--text-dim);color:var(--bg)}
#submit-btn{background:var(--primary);color:#fff;display:none}
#submit-btn:hover:not(:disabled){background:var(--primary-hover)}
#submit-btn.show{display:flex}
#hint-btn{background:transparent;color:var(--warning);border:1px solid var(--warning)!important;display:none}
#hint-btn.show{display:flex}
#hint-btn:hover{background:rgba(210,153,34,.1)}
#back-btn{background:var(--border);color:var(--text-dim);display:none;font-size:12px}
#back-btn.show{display:flex}
#back-btn:hover{color:var(--text)}
#controls button svg{width:15px;height:15px;fill:currentColor;flex-shrink:0}
#output{display:none;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
#output.show{display:block}
#output-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:var(--fs-small);color:var(--text-dim)}
#output-header .badge{font-size:11px;padding:2px 8px;border-radius:3px}
#output-header .badge.success{background:var(--success-bg);color:var(--success)}
#output-header .badge.error{background:var(--error-bg);color:var(--error)}
#output-content{padding:16px;font-family:"SF Mono","Fira Code","Cascadia Code",monospace;font-size:var(--fs-mono);line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:50px;max-height:350px;overflow-y:auto;background:var(--bg);color:var(--text);margin:0}
#output-content .out-log{color:var(--text)}
#output-content .out-err{color:var(--error)}
#output-content .out-info{color:var(--text-dim);font-style:italic}
.result-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;margin:4px 0;border-radius:4px;font-size:var(--fs-mono);line-height:1.5}
.result-item.pass{background:var(--success-bg)}
.result-item.fail{background:var(--error-bg)}
.result-item .icon{font-size:16px;flex-shrink:0;margin-top:1px}
.result-item .icon.pass{color:var(--success)}
.result-item .icon.fail{color:var(--error)}
.result-item .detail{flex:1}
.result-item .detail .args{color:var(--text-dim);font-size:12px}
.result-item .detail .got{color:var(--error);font-size:12px}
.result-item .detail .expected{color:var(--success);font-size:12px}
.result-summary{font-size:15px;font-weight:600;padding:10px 0 4px}
.result-summary.all-pass{color:var(--success)}
.result-summary.has-fail{color:var(--error)}
#sidebar::-webkit-scrollbar,#content::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-track,#content::-webkit-scrollbar-track{background:transparent}
#sidebar::-webkit-scrollbar-thumb,#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#loading-overlay.hide{opacity:0;pointer-events:none}
#loading-overlay .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-overlay .text{color:var(--text-dim);font-size:14px}
@media(max-width:820px){
  #sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;z-index:90;transform:translateX(-100%);transition:transform .25s;width:260px;min-width:260px}
  #sidebar.open{transform:translateX(0)}
  #menu-toggle{display:block}
  #content{padding:20px 14px}
  #editor-container{height:260px}
  #section-title{font-size:calc(var(--fs-title) - 4px)}
  #section-desc{font-size:calc(var(--fs-desc) - 1px)}
  #controls button{padding:7px 12px}
  .section-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:0}
  .section-tab{padding:7px 12px}
  #font-controls{display:none}
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="text">正在加载 C++ 教程 ...</div>
</div>

<header>
  <button id="menu-toggle" aria-label="菜单">&#9776;</button>
  <button id="theme-toggle" aria-label="切换主题" title="切换暗色/淡色主题"></button>
  <h1>C++ 快速入门教程</h1>
  <div id="font-controls">
    <button class="font-btn" data-size="small" title="小字号">A</button>
    <button class="font-btn active" data-size="medium" title="中字号（默认）">A</button>
    <button class="font-btn" data-size="large" title="大字号">A</button>
  </div>
  <span class="version">C++17</span>
</header>

<div id="app">
  <nav id="sidebar"></nav>

  <main id="content">
    <h2 id="section-title"></h2>
    <div id="section-progress"></div>

    <div class="section-tabs" id="section-tabs"></div>

    <div id="section-desc"></div>

    <div id="exercise-area">
      <div id="exercise-title"></div>
      <div id="exercise-desc"></div>
      <div id="exercise-hint"></div>
    </div>

    <div id="editor-wrap">
      <div id="editor-container" class="loading">加载编辑器中...</div>
    </div>

    <div id="controls">
      <button id="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        返回学习
      </button>
      <button id="run-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        运行代码
      </button>
      <button id="submit-btn">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        提交答案
      </button>
      <button id="hint-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        查看提示
      </button>
      <button id="reset-btn">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        重置代码
      </button>
    </div>

    <div id="output">
      <div id="output-header">
        <span>输出结果</span>
        <span id="output-status"></span>
      </div>
      <pre id="output-content"></pre>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
// ==================== 教程章节数据 ====================
const SECTIONS = [
  {
    "id": "intro",
    "icon": "⚡",
    "title": "C++ 简介",
    "desc": "<h4>C++ 是什么？</h4>\n<p>C++ 是由<strong>Bjarne Stroustrup</strong>于 1985 年在贝尔实验室开发的<strong>通用编程语言</strong>，作为 C 语言的扩展。它在 C 的基础上引入了<strong>面向对象</strong>、<strong>泛型编程</strong>和<strong>底层内存操作</strong>等特性，是目前工业界最强大的语言之一。</p>\n<h4>为什么学习 C++？</h4>\n<ul>\n<li><strong>系统编程</strong>：操作系统、数据库、浏览器等底层基础设施大多用 C++ 编写</li>\n<li><strong>高性能计算</strong>：游戏引擎、高频交易、科学计算领域的第一选择</li>\n<li><strong>零开销抽象</strong>：只为你使用的特性付出代价，不降低运行时性能</li>\n<li><strong>就业前景</strong>：腾讯、字节跳动、微软、Google 等大厂的核心岗位需求</li>\n</ul>\n<h4>编译流程</h4>\n<p>C++ 是<strong>编译型语言</strong>，源代码需要通过编译器转换为机器码才能执行。以下是完整的编译流程：</p>\n<svg viewBox=\"0 0 700 280\" style=\"max-width:100%;height:auto;margin:10px 0;background:#1a2332;border-radius:8px;padding:12px\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"arrow-c\" viewBox=\"0 0 10 10\" refX=\"10\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#58a6ff\"/></marker>\n    <style>.box-c{fill:#0f1419;stroke:#58a6ff;stroke-width:1.5;rx:6}.txt-c{fill:#e6edf3;font-size:13px;font-family:sans-serif;text-anchor:middle;dominant-baseline:middle}</style>\n  </defs>\n  <rect x=\"10\" y=\"20\" width=\"120\" height=\"44\" class=\"box-c\"/><text x=\"70\" y=\"42\" class=\"txt-c\">源代码 .cpp</text>\n  <line x1=\"130\" y1=\"42\" x2=\"170\" y2=\"42\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#arrow-c)\"/>\n  <rect x=\"170\" y=\"20\" width=\"120\" height=\"44\" class=\"box-c\"/><text x=\"230\" y=\"42\" class=\"txt-c\">预处理</text>\n  <line x1=\"290\" y1=\"42\" x2=\"330\" y2=\"42\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#arrow-c)\"/>\n  <rect x=\"330\" y=\"20\" width=\"120\" height=\"44\" class=\"box-c\"/><text x=\"390\" y=\"42\" class=\"txt-c\">编译</text>\n  <line x1=\"450\" y1=\"42\" x2=\"490\" y2=\"42\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#arrow-c)\"/>\n  <rect x=\"490\" y=\"20\" width=\"120\" height=\"44\" class=\"box-c\"/><text x=\"550\" y=\"42\" class=\"txt-c\">汇编 .o</text>\n  <line x1=\"550\" y1=\"64\" x2=\"550\" y2=\"120\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#arrow-c)\"/>\n  <rect x=\"490\" y=\"120\" width=\"120\" height=\"44\" class=\"box-c\"/><text x=\"550\" y=\"142\" class=\"txt-c\">链接</text>\n  <line x1=\"490\" y1=\"142\" x2=\"430\" y2=\"142\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#arrow-c)\"/>\n  <rect x=\"310\" y=\"120\" width=\"120\" height=\"44\" class=\"box-c\" stroke=\"#3fb950\"/><text x=\"370\" y=\"142\" class=\"txt-c\" fill=\"#3fb950\">可执行文件</text>\n  <text x=\"370\" y=\"195\" fill=\"#8b949e\" font-size=\"11\" text-anchor=\"middle\">g++ main.cpp -o program &amp;&amp; ./program</text>\n</svg>\n<h4>第一个程序</h4>\n<p>每个 C++ 程序都从 <code>main()</code> 函数开始执行。<code>#include &lt;iostream&gt;</code> 引入输入输出库，<code>cout</code> 用于向屏幕输出内容。</p>\n<pre><code>#include &lt;iostream&gt;\nusing namespace std;\nint main() {\n    cout &lt;&lt; \"Hello, World!\" &lt;&lt; endl;\n    return 0;\n}</code></pre>\n<p>运行上面的程序，屏幕上会显示 <code>Hello, World!</code>。这是每位程序员的第一个程序，标志着你正式进入了 C++ 的世界！</p>",
    "code": "#include <iostream>\nusing namespace std;\nint main() {\n    cout << \"Hello, World!\" << endl;\n    string name = \"C++\";\n    cout << \"Hi, \" << name << \"!\" << endl;\n    cout << \"欢迎学习 C++ 编程！\" << endl;\n    return 0;\n}",
    "exercises": [
      {
        "id": "cpp-i1",
        "title": "输出问候语",
        "desc": "编写程序，读入用户输入的姓名，然后输出 \"你好, [姓名]！欢迎学习 C++！\"。",
        "hint": "使用 <code>cin</code> 读取字符串，用 <code>cout</code> 输出拼接后的内容。",
        "starterCode": "#include <iostream>\nusing namespace std;\nint main() {\n    string name;\n    cin >> name;\n    // 在此处输出问候语\n    return 0;\n}",
        "solution": "#include <iostream>\nusing namespace std;\nint main() {\n    string name;\n    cin >> name;\n    cout << \"你好, \" << name << \"！欢迎学习 C++！\" << endl;\n    return 0;\n}",
        "fn": "",
        "tests": []
      },
      {
        "id": "cpp-i2",
        "title": "计算器输出",
        "desc": "编写程序，输出两个整数 123 和 456 的和、差、积、商，每行一个结果。",
        "hint": "直接用 <code>cout</code> 输出表达式结果，如 <code>cout << 123+456 << endl;</code>。",
        "starterCode": "#include <iostream>\nusing namespace std;\nint main() {\n    // 输出 123 和 456 的运算结果\n    return 0;\n}",
        "solution": "#include <iostream>\nusing namespace std;\nint main() {\n    cout << 123+456 << endl;\n    cout << 123-456 << endl;\n    cout << 123*456 << endl;\n    cout << 123/456 << endl;\n    return 0;\n}",
        "fn": "",
        "tests": []
      },
      {
        "id": "cpp-i3",
        "title": "int add(int, int)",
        "desc": "实现一个 <code>add</code> 函数，接收两个整数，返回它们的和。",
        "hint": "函数签名已经给出，只需在函数体内 <code>return a + b;</code>。",
        "starterCode": "int add(int a, int b) {\n    // 返回 a 和 b 的和\n}",
        "solution": "int add(int a, int b) { return a + b; }",
        "fn": "add",
        "tests": [{"args":[3,5],"expect":8},{"args":[-1,1],"expect":0},{"args":[100,200],"expect":300}]
      }
    ]
  },
  {
    "id": "types",
    "icon": "🔤",
    "title": "类型与 I/O",
    "desc": "<h4>基本数据类型</h4>\n<p>在 C++ 中，每一个数据都有确定的<strong>类型</strong>，类型决定了数据占用的内存大小、取值范围以及可以执行的操作。C++ 提供了丰富的<strong>内置数据类型</strong>供开发者使用，涵盖了整数、浮点数、字符、布尔等常见需求。理解这些类型是编写正确程序的基础，也是进一步学习指针、引用、类等高级特性的必要前提。</p>\n<pre><code>int i = 42;              // 整型，4 字节，范围约 -21 亿 到 21 亿\ndouble d = 3.14159;      // 双精度浮点型，8 字节，精度约 15-17 位\nchar c = 'A';            // 字符型，1 字节，存储 ASCII 字符\nbool b = true;           // 布尔型，true/false，本质是整数\nstring s = \"Hello\";      // 字符串（需 #include &lt;string&gt;）\nauto x = 42;             // 类型自动推导为 int\nconst int MAX = 100;     // 常量，初始化后不可修改</code></pre>\n<h4>输入输出</h4>\n<p>C++ 标准库提供了便捷的<strong>控制台输入输出</strong>方式。<code>cout</code>（字符输出流）配合插入运算符 <code>&lt;&lt;</code> 将数据输出到屏幕，<code>cin</code>（字符输入流）配合提取运算符 <code>&gt;&gt;</code> 从键盘读取输入。它们定义在 <code>&lt;iostream&gt;</code> 头文件中，使用前需要 <code>#include</code>：</p>\n<pre><code>int age;\ncout &lt;&lt; \"请输入年龄：\";\ncin &gt;&gt; age;\ncout &lt;&lt; \"你的年龄是 \" &lt;&lt; age &lt;&lt; \" 岁\" &lt;&lt; endl;</code></pre>\n<p><code>endl</code> 表示换行并刷新输出缓冲区。你也可以用 <code>\"\\n\"</code> 换行，它不会刷新缓冲区，性能更好。</p>\n<h4>类型转换</h4>\n<p>在 C++ 中，不同类型的值可以相互转换。转换分为<strong>隐式转换</strong>（由编译器自动完成）和<strong>显式转换</strong>（由程序员手动进行）：</p>\n<ul>\n<li><strong>隐式转换</strong>：<code>double d = 3;</code> 将 int 自动提升为 double</li>\n<li><strong>C 风格强制转换</strong>：<code>int i = (int)3.14;</code> 结果为 3，截断小数</li>\n<li><strong>C++ 风格转换</strong>：<code>static_cast&lt;int&gt;(3.14)</code>，更安全，易于搜索</li>\n</ul>\n<h4>常量与字面量</h4>\n<p>用 <code>const</code> 关键字声明常量，一旦初始化就不能修改。字面量是直接写在代码中的值，如 <code>42</code>（整型）、<code>3.14f</code>（float）、<code>'A'</code>（字符）。给字面量加后缀可以指定类型，如 <code>100L</code> 表示 long 类型。</p>",

    "desc": "<h4>条件分支</h4>\n<p>C++ 使用 <strong>if-else</strong> 和 <strong>switch</strong> 语句实现条件判断：</p>\n<pre><code>if (score &gt;= 60) {\n    cout &lt;&lt; \"及格\";\n} else if (score &gt;= 0) {\n    cout &lt;&lt; \"不及格\";\n} else {\n    cout &lt;&lt; \"无效分数\";\n}\n\nswitch (grade) {\n    case 'A': cout &lt;&lt; \"优秀\"; break;\n    case 'B': cout &lt;&lt; \"良好\"; break;\n    default:  cout &lt;&lt; \"继续努力\";\n}</code></pre>\n<h4>循环结构</h4>\n<p>C++ 有三种循环：<strong>for</strong>（已知次数）、<strong>while</strong>（条件前置）和 <strong>do-while</strong>（条件后置）：</p>\n<pre><code>for (int i = 0; i &lt; 5; i++) {\n    cout &lt;&lt; i &lt;&lt; \" \";\n}\n\nint n = 5;\nwhile (n &gt; 0) {\n    n--;\n}\n\ndo {\n    // 至少执行一次\n} while (条件);</code></pre>\n<svg viewBox=\"0 0 680 420\" style=\"max-width:100%;height:auto;margin:10px 0;background:#1a2332;border-radius:8px;padding:12px\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <marker id=\"arrow-f\" viewBox=\"0 0 10 10\" refX=\"10\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#58a6ff\"/></marker>\n    <style>.box-f{fill:#0f1419;stroke:#58a6ff;stroke-width:1.5;rx:6}.diamond{fill:#0f1419;stroke:#d29922;stroke-width:1.5}.txt-f{fill:#e6edf3;font-size:12px;font-family:sans-serif;text-anchor:middle;dominant-baseline:middle}.lbl{fill:#8b949e;font-size:10px;font-family:sans-serif;text-anchor:middle}</style>\n  </defs>\n  <text x=\"340\" y=\"16\" fill=\"#58a6ff\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">if-else 分支</text>\n  <rect x=\"270\" y=\"28\" width=\"100\" height=\"34\" class=\"box-f\"/><text x=\"320\" y=\"45\" class=\"txt-f\">条件</text>\n  <line x1=\"320\" y1=\"62\" x2=\"320\" y2=\"88\" stroke=\"#58a6ff\" stroke-width=\"1.5\" marker-end=\"url(#arrow-f)\"/>\n  <polygon points=\"320,88 280,108 320,128 360,108\" class=\"diamond\"/><text x=\"320\" y=\"108\" class=\"txt-f\" fill=\"#d29922\">x &gt; 0?</text>\n  <line x1=\"280\" y1=\"108\" x2=\"200\" y2=\"108\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#arrow-f)\"/><text x=\"240\" y=\"100\" class=\"lbl\" fill=\"#3fb950\">是</text>\n  <rect x=\"120\" y=\"92\" width=\"80\" height=\"34\" class=\"box-f\" stroke=\"#3fb950\"/><text x=\"160\" y=\"109\" class=\"txt-f\" fill=\"#3fb950\">输出正数</text>\n  <line x1=\"360\" y1=\"108\" x2=\"440\" y2=\"108\" stroke=\"#f85149\" stroke-width=\"1.5\" marker-end=\"url(#arrow-f)\"/><text x=\"400\" y=\"100\" class=\"lbl\" fill=\"#f85149\">否</text>\n  <rect x=\"440\" y=\"92\" width=\"80\" height=\"34\" class=\"box-f\" stroke=\"#f85149\"/><text x=\"480\" y=\"109\" class=\"txt-f\" fill=\"#f85149\">输出负数</text>\n\n  <text x=\"340\" y=\"180\" fill=\"#58a6ff\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\">for 循环</text>\n  <rect x=\"155\" y=\"195\" width=\"110\" height=\"34\" class=\"box-f\"/><text x=\"210\" y=\"212\" class=\"txt-f\">int i = 0</text>\n  <line x1=\"265\" y1=\"212\" x2=\"330\" y2=\"212\" stroke=\"#58a6ff\" stroke-width=\"1.5\" marker-end=\"url(#arrow-f)\"/>\n  <polygon points=\"330,195 380,212 330,230 280,212\" class=\"diamond\" transform=\"translate(30,0)\"/><text x=\"343\" y=\"212\" class=\"txt-f\" fill=\"#d29922\">i &lt; 5?</text>\n  <line x1=\"303\" y1=\"230\" x2=\"280\" y2=\"280\" stroke=\"#3fb950\" stroke-width=\"1.5\" marker-end=\"url(#arrow-f)\"/><text x=\"275\" y=\"252\" class=\"lbl\" fill=\"#3fb950\">是</text>\n  <rect x=\"200\" y=\"280\" width=\"100\" height=\"34\" class=\"box-f\" stroke=\"#3fb950\"/><text x=\"250\" y=\"297\" class=\"txt-f\" fill=\"#3fb950\">循环体</text>\n  <line x1=\"300\" y1=\"297\" x2=\"400\" y2=\"297\" stroke=\"#8b949e\" stroke-width=\"1\" marker-end=\"url(#arrow-f)\"/>\n  <rect x=\"400\" y=\"280\" width=\"100\" height=\"34\" class=\"box-f\"/><text x=\"450\" y=\"297\" class=\"txt-f\">i++</text>\n  <line x1=\"450\" y1=\"280\" x2=\"380\" y2=\"230\" stroke=\"#8b949e\" stroke-width=\"1\" marker-end=\"url(#arrow-f)\"/>\n  <line x1=\"383\" y1=\"230\" x2=\"440\" y2=\"240\" stroke=\"#f85149\" stroke-width=\"1.5\" marker-end=\"url(#arrow-f)\"/><text x=\"405\" y=\"252\" class=\"lbl\" fill=\"#f85149\">否</text>\n  <rect x=\"440\" y=\"240\" width=\"80\" height=\"34\" class=\"box-f\" stroke=\"#f85149\"/><text x=\"480\" y=\"257\" class=\"txt-f\" fill=\"#f85149\">结束</text>\n</svg>\n<h4>流程控制语句</h4>\n<ul>\n<li><strong>break</strong>：跳出当前循环</li>\n<li><strong>continue</strong>：跳过本次循环剩余语句，进入下一轮</li>\n<li><strong>return</strong>：结束当前函数</li>\n</ul>",

    "title": "函数与重载",
    "desc": "<h4>函数定义</h4>\n<p><strong>函数</strong>是组织代码的基本单位，它将一段完成特定功能的代码封装起来，可以重复调用。在 C++ 中，函数的通用格式为：<strong>返回类型 + 函数名 + 参数列表 + 函数体</strong>。每个 C++ 程序都从 <code>main</code> 函数开始执行。合理地使用函数可以显著提高代码的<strong>可读性</strong>、<strong>复用性</strong>和<strong>可维护性</strong>。函数可以调用其他函数，也可以递归调用自身，这种灵活性使得复杂算法的实现变得简洁清晰。</p>\n<pre><code>返回类型 函数名(参数列表) {\n    函数体\n    return 返回值;\n}</code></pre>\n<h4>函数重载</h4>\n<p>C++ 允许在<strong>同一个作用域</strong>中定义多个<strong>同名函数</strong>，只要它们具有不同的<strong>参数列表</strong>（参数个数、类型或顺序不同），这称为<strong>函数重载</strong>。编译器在编译期间根据传入实参的类型和个数自动匹配最合适的版本。重载大大提高了代码的表达力，让同一操作名称可以作用于不同类型的数据，这也是 C++ 多态性的一种体现：</p>\n<pre><code>int max(int a, int b) {\n    return a &gt; b ? a : b;\n}\ndouble max(double a, double b) {\n    return a &gt; b ? a : b;\n}\nstring max(string a, string b) {\n    return a &gt; b ? a : b;  // 按字典序比较\n}</code></pre>\n<h4>默认参数</h4>\n<p>函数参数可以设置<strong>默认值</strong>，调用时如果省略该参数则使用默认值。默认参数必须从右向左连续设置，即一旦某个参数有默认值，它右边所有参数都必须有默认值：</p>\n<pre><code>void greet(string name = \"World\") {\n    cout &lt;&lt; \"Hello, \" &lt;&lt; name &lt;&lt; endl;\n}\ngreet();           // Hello, World\ngreet(\"C++\");      // Hello, C++</code></pre>\n<h4>值传递与引用传递</h4>\n<ul>\n<li><strong>值传递</strong>：函数接收参数的<strong>副本</strong>，函数内对参数的修改不影响原变量</li>\n<li><strong>引用传递</strong>：使用 <code>&amp;</code> 符号声明，函数直接操作原变量，适合需要<strong>修改外部变量</strong>或<strong>避免大对象复制</strong>的场景</li>\n<li><strong>const 引用</strong>：<code>const string&amp; s</code>，既避免复制又防止修改，是传只读大对象的首选方式</li>\n</ul>",
    "code": "#include <iostream>\n#include <string>\nusing namespace std;\nint max(int a, int b) { return a > b ? a : b; }\ndouble max(double a, double b) { return a > b ? a : b; }\nstring max(string a, string b) { return a > b ? a : b; }\nvoid greet(string name = \"World\") {\n    cout << \"Hello, \" << name << endl;\n}\nint main() {\n    cout << max(3, 7) << endl;\n    cout << max(3.14, 2.71) << endl;\n    cout << max(\"cat\", \"dog\") << endl;\n    greet();\n    greet(\"C++\");\n    return 0;\n}",

    "desc": "<h4>数组</h4>\n<p>数组是 C++ 中最基本的数据结构之一，它在<strong>连续的内存空间</strong>中存储<strong>相同类型</strong>的多个元素。数组的大小在<strong>编译时期</strong>就已经确定，创建后不能改变。数组中的每个元素通过<strong>索引</strong>访问，索引从 <strong>0</strong> 开始。需要注意的是，C++ 的原始数组不提供越界检查，访问超出范围的元素会引发<strong>未定义行为</strong>，这是很多 bug 的根源，因此现代 C++ 更推荐使用 <code>vector</code> 或 <code>array</code>：</p>\n<pre><code>int arr[5] = {1, 2, 3, 4, 5};\nint first = arr[0];     // 索引从 0 开始\nint len = sizeof(arr) / sizeof(arr[0]);  // 计算长度\n\n// 遍历数组\nfor (int i = 0; i &lt; 5; i++) {\n    cout &lt;&lt; arr[i] &lt;&lt; \" \";\n}</code></pre>\n<h4>vector 动态数组</h4>\n<p><code>std::vector</code> 是 C++ 标准模板库提供的<strong>动态数组</strong>容器，它<strong>自动管理内存</strong>，大小可以根据需要动态增长。使用 vector 需要包含 <code>&lt;vector&gt;</code> 头文件。与原始数组不同，vector 提供了 <code>size()</code> 方法获取元素个数，还支持 <strong>范围 for 循环</strong> 遍历。它也是 STL 容器中最常用、最灵活的一个，广泛应用于各种编程场景：</p>\n<pre><code>#include &lt;vector&gt;\nvector&lt;int&gt; v = {1, 2, 3};\nv.push_back(4);          // 末尾添加元素\nv.pop_back();            // 删除末尾元素\nint s = v.size();        // 当前大小\nfor (int x : v) {        // 范围 for 循环\n    cout &lt;&lt; x &lt;&lt; \" \";\n}</code></pre>\n<h4>字符串</h4>\n<p><code>std::string</code> 是 C++ 中处理文本的得力工具，它提供了丰富的<strong>字符串操作</strong>方法。string 内部管理着动态分配的字符数组，可以自动调整大小。它支持拼接（<code>+</code>、<code>+=</code>）、按索引访问字符（<code>[]</code>）、截取子串（<code>substr</code>）、查找（<code>find</code>）等常用操作。string 也兼容 C 风格字符串函数，通过 <code>c_str()</code> 方法可以获取 <code>const char*</code> 指针：</p>\n<pre><code>string s = \"Hello\";\ns += \" World\";           // 拼接\nint len = s.length();    // 长度\nchar c = s[0];           // 访问字符\nstring sub = s.substr(0, 5);  // 子串\nsize_t pos = s.find(\"World\"); // 查找</code></pre>",
    "code": "#include <iostream>\n#include <vector>\n#include <string>\nusing namespace std;\nint main() {\n    vector<int> v = {10, 20, 30, 40, 50};\n    string s = \"C++ Tutorial\";\n    int sum = 0;\n    for (int x : v) sum += x;\n    cout << \"Sum=\" << sum << endl;\n    cout << \"Avg=\" << (double)sum / v.size() << endl;\n    cout << \"Len=\" << s.length() << \" First=\" << s[0] << endl;\n    return 0;\n}",

ke-width=\"1.5\" stroke-dasharray=\"6,3\" marker-end=\"url(#arrow-f)\"/>\n  <rect x=\"350\" y=\"30\" width=\"240\" height=\"80\" class=\"cls-box\" stroke=\"#3fb950\"/>\n  <text x=\"470\" y=\"54\" class=\"cls-title\" fill=\"#3fb950\">main()</text>\n  <line x1=\"350\" y1=\"64\" x2=\"590\" y2=\"64\" class=\"cls-line\" stroke=\"#3fb950\"/>\n  <text x=\"368\" y=\"82\" class=\"cls-method\" fill=\"#3fb950\">Rectangle r(5, 3)</text>\n  <text x=\"368\" y=\"100\" class=\"cls-method\" fill=\"#3fb950\">r.area() → 15</text>\n\n  <defs>\n    <marker id=\"arrow-f\" viewBox=\"0 0 10 10\" refX=\"10\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#58a6ff\"/></marker>\n  </defs>\n</svg>\n<h4>访问控制</h4>\n<ul>\n<li><strong>public</strong>：任何地方都可以访问</li>\n<li><strong>private</strong>：只有类内部可以访问（默认）</li>\n<li><strong>protected</strong>：类内部和派生类可以访问</li>\n</ul>\n<h4>构造函数</h4>\n<p>构造函数在创建对象时自动调用，用于初始化成员变量。C++ 使用<strong>初始化列表</strong>语法高效初始化：</p>\n<pre><code>class Circle {\npublic:\n    Circle(double r) : radius(r) {}  // 初始化列表\n    double area() { return 3.14159 * radius * radius; }\nprivate:\n    double radius;\n};\nCircle c(5.0);  // 创建对象，自动调用构造函数</code></pre>",

<line x1=\"380\" y1=\"165\" x2=\"380\" y2=\"200\" stroke=\"#58a6ff\" stroke-width=\"2\" marker-end=\"url(#arrow-i)\"/>\n\n  <rect x=\"130\" y=\"200\" width=\"210\" height=\"85\" class=\"ih-box\"/>\n  <text x=\"235\" y=\"222\" class=\"ih-title\">Circle</text>\n  <line x1=\"130\" y1=\"230\" x2=\"340\" y2=\"230\" class=\"ih-line\"/>\n  <text x=\"150\" y=\"246\" class=\"ih-field\">- radius : double</text>\n  <text x=\"150\" y=\"262\" class=\"ih-method\">+ area() : double [override]</text>\n  <text x=\"150\" y=\"278\" class=\"ih-method\">+ Circle(r : double)</text>\n\n  <rect x=\"340\" y=\"200\" width=\"210\" height=\"85\" class=\"ih-box\"/>\n  <text x=\"445\" y=\"222\" class=\"ih-title\">Rectangle</text>\n  <line x1=\"340\" y1=\"230\" x2=\"550\" y2=\"230\" class=\"ih-line\"/>\n  <text x=\"360\" y=\"246\" class=\"ih-field\">- width, height : double</text>\n  <text x=\"360\" y=\"262\" class=\"ih-method\">+ area() : double [override]</text>\n  <text x=\"360\" y=\"278\" class=\"ih-method\">+ Rectangle(w,h)</text>\n\n  <defs>\n    <marker id=\"arrow-i\" viewBox=\"0 0 10 10\" refX=\"10\" refY=\"5\" markerWidth=\"10\" markerHeight=\"10\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#58a6ff\"/></marker>\n  </defs>\n</svg>\n<h4>多态</h4>\n<p>多态允许通过<strong>基类指针</strong>调用派生类重写的方法。基类用 <code>virtual</code> 声明，派生类用 <code>override</code> 重写，程序根据实际类型决定调用哪个版本：</p>\n<pre><code>Shape* shapes[2];\nshapes[0] = new Circle(5);\nshapes[1] = new Rectangle(4, 6);\nfor (int i = 0; i &lt; 2; i++) {\n    cout &lt;&lt; shapes[i]-&gt;area() &lt;&lt; endl;\n    delete shapes[i];\n}</code></pre>\n<h4>纯虚函数与抽象类</h4>\n<p>包含纯虚函数（<code>= 0</code>）的类是<strong>抽象类</strong>，不能直接实例化，只能作为基类。派生类必须实现所有纯虚函数才能被实例化。</p>",
    "code": "#include <iostream>\nusing namespace std;\nclass Shape {\npublic:\n    virtual double area() const = 0;\n    virtual void print() const = 0;\n    virtual ~Shape() {}\n};\nclass Circle : public Shape {\n    double r;\npublic:\n    Circle(double r) : r(r) {}\n    double area() const override { return 3.14159 * r * r; }\n    void print() const override { cout << \"Circle r=\" << r << \" area=\" << area() << endl; }\n};\nclass Rect : public Shape {\n    int w, h;\npublic:\n    Rect(int w, int h) : w(w), h(h) {}\n    double area() const override { return w * h; }\n    void print() const override { cout << \"Rect \" << w << \"x\" << h << \" area=\" << area() << endl; }\n};\nint main() {\n    Shape* shapes[2] = { new Circle(5), new Rect(4, 6) };\n    for (int i = 0; i < 2; i++) { shapes[i]->print(); delete shapes[i]; }\n    return 0;\n}",

    "title": "STL 容器",
    "desc": "<h4>什么是 STL？</h4>\n<p><strong>STL</strong>（Standard Template Library，标准模板库）是 C++ 标准库的核心部分，提供了<strong>容器</strong>、<strong>算法</strong>和<strong>迭代器</strong>三大组件。使用 STL 可以大幅提高开发效率。</p>\n<h4>常用容器</h4>\n<pre><code>// vector：动态数组\nvector&lt;int&gt; v = {3, 1, 4, 1, 5};\nv.push_back(9);\nsort(v.begin(), v.end());\n\n// map：键值对映射（红黑树）\nmap&lt;string, int&gt; scores;\nscores[\"Alice\"] = 95;\nscores[\"Bob\"] = 87;\n\n// set：有序集合（红黑树）\nset&lt;int&gt; s = {3, 1, 4, 1, 5};  // 自动去重排序\ns.insert(2);\n\n// unordered_map：哈希表 (C++11)\nunordered_map&lt;string, int&gt; um;\num[\"key\"] = 42;</code></pre>\n<h4>常用算法</h4>\n<p>STL 算法位于 <code>&lt;algorithm&gt;</code> 头文件中：</p>\n<pre><code>sort(v.begin(), v.end());          // 排序\nreverse(v.begin(), v.end());       // 反转\nbinary_search(v.begin(), v.end(), 5);  // 二分查找\nauto it = find(v.begin(), v.end(), 3); // 查找\nint c = count(v.begin(), v.end(), 1);  // 计数</code></pre>\n<h4>迭代器</h4>\n<p>迭代器是 STL 的\" glue\"，通过 <code>begin()</code> 和 <code>end()</code> 获取容器的起始和结束位置：</p>\n<pre><code>for (auto it = v.begin(); it != v.end(); ++it) {\n    cout &lt;&lt; *it &lt;&lt; \" \";\n}</code></pre>",
    "code": "#include <iostream>\n#include <vector>\n#include <map>\n#include <set>\n#include <algorithm>\nusing namespace std;\nint main() {\n    vector<int> v = {3, 1, 4, 1, 5, 9, 2, 6};\n    sort(v.begin(), v.end());\n    cout << \"Sorted: \"; for (int x : v) cout << x << \" \"; cout << endl;\n    map<string, int> ages;\n    ages[\"Alice\"] = 25; ages[\"Bob\"] = 30; ages[\"Charlie\"] = 35;\n    for (auto& p : ages) cout << p.first << \": \" << p.second << endl;\n    return 0;\n}",

// ==================== 全局变量 ====================
let editor = null;
let editorReady = false;
let currentSectionId = 'intro';
let currentTab = 'learn';
let currentExerciseIndex = -1;
let isRunning = false;
let exerciseResults = {};

const originalCodes = {};
SECTIONS.forEach(s => { originalCodes[s.id] = s.code; });




// ==================== 练习进度持久化 ====================
function loadProgress() {
  try {
    const saved = localStorage.getItem('cpp-tutorial-progress');
    if (saved) exerciseResults = JSON.parse(saved);
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem('cpp-tutorial-progress', JSON.stringify(exerciseResults));
  } catch(e) {}
}

function markExerciseDone(sectionId, exerciseId) {
  if (!exerciseResults[sectionId]) exerciseResults[sectionId] = {};
  exerciseResults[sectionId][exerciseId] = true;
  saveProgress();
}

// ==================== 工具函数 ====================
function toPythonLiteral(val) {
  if (val === null || val === undefined) return 'None';
  if (typeof val === 'boolean') return val ? 'True' : 'False';
  if (typeof val === 'number') {
    if (Number.isInteger(val) && Math.abs(val) < 1e15) return String(val);
    return String(val);
  }
  if (typeof val === 'string') {
    const escaped = val.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
    return "'" + escaped + "'";
  }
  if (Array.isArray(val)) return '[' + val.map(toPythonLiteral).join(', ') + ']';
  if (typeof val === 'object') {
    const items = Object.entries(val).map(([k, v]) => toPythonLiteral(k) + ': ' + toPythonLiteral(v));
    return '{' + items.join(', ') + '}';
  }
  return String(val);
}

function formatValue(val) {
  if (val === null) return 'None';
  if (val === undefined) return 'None';
  if (typeof val === 'object') {
    try { return JSON.stringify(val, null, 2); }
    catch(e) { return String(val); }
  }
  return String(val);
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================== 代码缓存 ====================
function cacheKey() {
  if (currentTab === 'learn' || currentExerciseIndex === -1) return 'cpp-' + currentSectionId;
  return 'cpp-' + currentSectionId + '-' + currentExerciseIndex;
}

function saveCode() {
  if (!editor) return;
  try { localStorage.setItem(cacheKey(), editor.getValue()); } catch(e) {}
}

function loadCachedCode(fallback) {
  try {
    const cached = localStorage.getItem(cacheKey());
    return cached !== null ? cached : fallback;
  } catch(e) { return fallback; }
}

function clearCachedCode() {
  try { localStorage.removeItem(cacheKey()); } catch(e) {}
}

// ==================== 初始化 ====================
function init() {
  hideLoading();
  loadProgress();
  loadPreferences();
  renderSidebar();
  setupKeyboardShortcut();
  setupMenuToggle();
  setupButtons();
  createEditor();
}

function setupButtons() {
  const runBtn = document.getElementById('run-btn');
  const resetBtn = document.getElementById('reset-btn');
  const submitBtn = document.getElementById('submit-btn');
  const hintBtn = document.getElementById('hint-btn');
  const backBtn = document.getElementById('back-btn');
  if (runBtn) runBtn.addEventListener('click', runCode);
  if (resetBtn) resetBtn.addEventListener('click', resetCode);
  if (submitBtn) submitBtn.addEventListener('click', submitExercise);
  if (hintBtn) hintBtn.addEventListener('click', toggleHint);
  if (backBtn) backBtn.addEventListener('click', goBackToLearn);

  const themeToggle = document.getElementById('theme-toggle');
  if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

  document.querySelectorAll('.font-btn').forEach(btn => {
    btn.addEventListener('click', () => setFontSize(btn.dataset.size));
  });
}

function hideLoading() {
  const el = document.getElementById('loading-overlay');
  if (el) el.classList.add('hide');
}

// ==================== 侧边栏 ====================
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  sidebar.innerHTML = SECTIONS.map((s, i) => {
    const done = exerciseResults[s.id];
    const count = s.exercises ? s.exercises.length : 0;
    const doneCount = done ? Object.keys(done).length : 0;
    const doneMark = count > 0 && doneCount >= count ? ' <span class="done">✓全部</span>' : '';
    return '<a class="section" data-id="' + s.id + '" href="javascript:void(0)">'
      + '<span class="num">' + (i + 1) + '.</span> ' + (s.icon || '') + ' ' + s.title + doneMark
    + '</a>';
  }).join('<div class="divider"></div>');
  sidebar.addEventListener('click', (e) => {
    const el = e.target.closest('.section');
    if (el) {
      const id = el.dataset.id;
      if (id !== currentSectionId) {
        loadSection(id);
        document.getElementById('sidebar').classList.remove('open');
      }
    }
  });
}

function highlightSidebar(id) {
  document.querySelectorAll('#sidebar .section').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ==================== 章节加载 ====================
function loadSection(id) {
  const section = SECTIONS.find(s => s.id === id);
  if (!section) return;
  currentSectionId = id;
  currentTab = 'learn';
  currentExerciseIndex = -1;

  document.getElementById('section-title').textContent = section.title;
  document.getElementById('section-desc').innerHTML = section.desc;
  document.getElementById('content').scrollTop = 0;
  highlightSidebar(id);
  document.getElementById('output').classList.remove('show');

  updateProgress(section);
  renderTabs(section);

  document.getElementById('section-desc').style.display = 'block';
  document.getElementById('exercise-area').classList.remove('show');
  document.getElementById('submit-btn').classList.remove('show');
  document.getElementById('hint-btn').classList.remove('show');
  document.getElementById('back-btn').classList.remove('show');

  if (editor) {
    editor.setValue(section.code);
    const model = editor.getModel();
    if (model) model.undo();
  }
}

function updateProgress(section) {
  const el = document.getElementById('section-progress');
  if (!section.exercises || section.exercises.length === 0) {
    el.textContent = '';
    return;
  }
  const done = exerciseResults[section.id] || {};
  const doneCount = Object.keys(done).length;
  const total = section.exercises.length;
  el.textContent = '练习进度: ' + doneCount + '/' + total + (doneCount >= total ? ' 🎉 全部完成!' : '');
}

// ==================== 标签页 ====================
function renderTabs(section) {
  const tabsEl = document.getElementById('section-tabs');
  let html = '<div class="section-tab active" data-tab="learn">📖 学习</div>';
  if (section.exercises) {
    section.exercises.forEach((ex, i) => {
      const done = exerciseResults[section.id] && exerciseResults[section.id][ex.id];
      html += '<div class="section-tab' + (done ? ' done' : '') + '" data-tab="' + i + '">练习 ' + (i+1) + (done ? '<span class="check">✓</span>' : '') + '</div>';
    });
  }
  tabsEl.innerHTML = html;

  tabsEl.querySelectorAll('.section-tab').forEach(el => {
    el.addEventListener('click', () => {
      const tab = el.dataset.tab;
      if (tab === 'learn') {
        switchToLearn(section);
      } else {
        switchToExercise(section, parseInt(tab));
      }
    });
  });
}

function switchToLearn(section) {
  currentTab = 'learn';
  currentExerciseIndex = -1;

  document.querySelectorAll('#section-tabs .section-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === 'learn');
  });

  document.getElementById('section-desc').style.display = 'block';
  document.getElementById('exercise-area').classList.remove('show');
  document.getElementById('submit-btn').classList.remove('show');
  document.getElementById('hint-btn').classList.remove('show');
  document.getElementById('back-btn').classList.remove('show');
  document.getElementById('output').classList.remove('show');

  if (editor) {
    editor.setValue(loadCachedCode(section.code));
    const model = editor.getModel();
    if (model) model.undo();
  }
}

function switchToExercise(section, index) {
  if (!section.exercises || !section.exercises[index]) return;

  currentTab = 'exercise';
  currentExerciseIndex = index;
  const ex = section.exercises[index];

  document.querySelectorAll('#section-tabs .section-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === String(index));
  });

  document.getElementById('section-desc').style.display = 'none';
  document.getElementById('exercise-area').classList.add('show');
  document.getElementById('exercise-title').textContent = ex.title;
  document.getElementById('exercise-desc').innerHTML = ex.desc;
  document.getElementById('exercise-hint').innerHTML = ex.hint || '';
  document.getElementById('exercise-hint').classList.remove('show');
  document.getElementById('submit-btn').classList.add('show');
  document.getElementById('hint-btn').classList.add('show');
  document.getElementById('back-btn').classList.add('show');
  document.getElementById('output').classList.remove('show');

  if (editor) {
    editor.setValue(loadCachedCode(ex.starterCode));
    const model = editor.getModel();
    if (model) model.undo();
  }
}

function goBackToLearn() {
  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (section) switchToLearn(section);
}

function toggleHint() {
  const hint = document.getElementById('exercise-hint');
  hint.classList.toggle('show');
  document.getElementById('hint-btn').textContent = hint.classList.contains('show') ? '隐藏提示' : '查看提示';
}

// ==================== Monaco Editor ====================
function createEditor() {
  if (editorReady) return;
  editorReady = true;

  require.config({
    paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }
  });

  require(['vs/editor/editor.main'], () => {
    const container = document.getElementById('editor-container');
    if (!container) return;
    container.classList.remove('loading');
    container.innerHTML = '';
    container.style.height = '380px';

    const savedTheme = localStorage.getItem('cpp-theme') || 'light';
    const isLight = savedTheme === 'light';
    if (isLight) document.body.classList.add('light');

    editor = monaco.editor.create(container, {
      value: SECTIONS[0].code,
      language: 'cpp',
      theme: isLight ? 'vs' : 'vs-dark',
      minimap: { enabled: false },
      fontSize: 14,
      lineNumbers: 'on',
      scrollBeyondLastLine: false,
      automaticLayout: true,
      wordWrap: 'on',
      tabSize: 4,
      renderWhitespace: 'selection',
      padding: { top: 12 },
    });

    loadSection(currentSectionId);

    let saveTimer;
    editor.onDidChangeModelContent(() => {
      const lineCount = editor.getModel().getLineCount();
      const newHeight = Math.min(Math.max(lineCount * 22, 200), 600);
      container.style.height = newHeight + 'px';
      editor.layout();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveCode, 500);
    });
  });
}


function resetCode() {
  if (!editor) return;
  clearCachedCode();
  const section = SECTIONS.find(s => s.id === currentSectionId);
  if (currentTab === 'learn' || currentExerciseIndex === -1) {
    editor.setValue(section.code);
  } else if (section.exercises && section.exercises[currentExerciseIndex]) {
    editor.setValue(section.exercises[currentExerciseIndex].starterCode);
  }
  document.getElementById('output').classList.remove('show');
}

// ==================== 主题切换 ====================
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  const theme = isLight ? 'light' : 'dark';
  localStorage.setItem('cpp-theme', theme);
  if (editor) monaco.editor.setTheme(isLight ? 'vs' : 'vs-dark');
}

// ==================== 字号控制 ====================
function setFontSize(level) {
  const sizes = {
    small: { base:'13px', mono:'12px', title:'22px', desc:'13px', code:'12px', small:'11px', sidebar:'12px', tab:'12px' },
    medium: { base:'15px', mono:'14px', title:'26px', desc:'15px', code:'13px', small:'12px', sidebar:'14px', tab:'13px' },
    large: { base:'17px', mono:'16px', title:'30px', desc:'17px', code:'15px', small:'13px', sidebar:'15px', tab:'14px' },
  };
  const s = sizes[level] || sizes.medium;
  const root = document.documentElement;
  root.style.setProperty('--fs-base', s.base);
  root.style.setProperty('--fs-mono', s.mono);
  root.style.setProperty('--fs-title', s.title);
  root.style.setProperty('--fs-desc', s.desc);
  root.style.setProperty('--fs-code', s.code);
  root.style.setProperty('--fs-small', s.small);
  root.style.setProperty('--fs-sidebar', s.sidebar);
  root.style.setProperty('--fs-tab', s.tab);
  if (editor) editor.updateOptions({ fontSize: parseInt(s.mono) });

  document.querySelectorAll('.font-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.size === level);
  });
  localStorage.setItem('cpp-font-size', level);
}

function loadPreferences() {
  const savedSize = localStorage.getItem('cpp-font-size') || 'medium';
  const savedTheme = localStorage.getItem('cpp-theme') || 'light';
  if (savedTheme === 'light') document.body.classList.add('light');
  if (savedSize !== 'medium') setFontSize(savedSize);
  else document.querySelector('.font-btn[data-size="medium"]')?.classList.add('active');
}

function setupKeyboardShortcut() {
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      if (currentTab === 'exercise' && currentExerciseIndex >= 0) {
        submitExercise();
      } else {
        runCode();
      }
    }
  });
}

function setupMenuToggle() {
  document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
}

// ==================== 启动 ====================
function boot() {
  if (typeof require === 'undefined') {
    showError('加载 Monaco Editor 失败，请刷新页面重试');
    return;
  }
  init();
}

function showError(msg) {
  hideLoading();
  const container = document.getElementById('editor-container');
  if (container) container.innerHTML = '<div style="color:#f85149;padding:40px;text-align:center;font-size:15px">' + escHtml(msg) + '</div>';
}

if (document.readyState === 'complete') {
  boot();
} else {
  window.addEventListener('load', boot);
}

setTimeout(() => {
  hideLoading();
  if (!editor) {
    const container = document.getElementById('editor-container');
    if (container && container.classList.contains('loading')) {
      container.innerHTML = '<div style="color:#f85149;padding:40px;text-align:center;font-size:15px">⛔ Monaco Editor 加载超时，请检查网络连接后刷新页面</div>';
    }
    loadPreferences();
    renderSidebar();
    setupButtons();
    setupKeyboardShortcut();
    setupMenuToggle();
    loadSection(currentSectionId);
  }
}, 15000);
